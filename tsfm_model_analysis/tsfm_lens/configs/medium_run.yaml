# Medium real-model run (~300 series): TimesFM 2.5 vs Chronos-T5, against
# the benchmark built from tsfm_benchmark/configs/medium_run.yaml (three
# families: a diverse synthetic backbone, a fixed-recipe synthetic family,
# and genuine real-world Monash weather data). Every stage enabled -- this
# is the "all features" run, scaled for a single GPU in well under an hour
# rather than default.yaml's production scale.

run:
  name: medium_run
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false     # true if both models + headroom fit in VRAM

data:
  source: sealed
  path: /common/home/djk255/Desktop/TSFM Interp/benchmark_medium/public_dev
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 2      # 20 layers -> 10 capture points
  - name: Chronos-T5
    adapter: chronos
    checkpoint: amazon/chronos-t5-small
    batch_size: 32
    capture_layer_stride: 1      # 6 encoder blocks
    # Swap checkpoint to amazon/chronos-t5-base for a stronger (slower) run.

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15         # every family here has >= 40 series
  rsa: true
  rsa_max_series: 300

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 15000
  input_baseline: true

l3:
  enabled: true
  max_series: 300
  corruptions:
    noise: {snr_db: 6.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    frequency_shift: {factor: 2.0}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 3, scale: 6.0}
    smooth: {kernel: 9}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: true
    layer_stride: 2
    corruptions: [deseasonalize, noise, level_shift, spike, warp, dropout]
    max_series: 32               # must be <= every model's batch_size
    per_window: true             # layer x window restoration heatmaps
    window_stride: 1             # full time resolution (dataset is small enough)

lens:
  enabled: true
  layer_stride: 1
  max_series: 32                 # must be <= every model's batch_size
  tuned: true
  tuned_max_series: 300
  val_frac: 0.25
  lambdas: [0.001, 0.01, 0.1, 1.0]
  crystallization_tol: 0.1

attention:
  enabled: true
  patterns: true
  max_series: 150
  batch_series: 32
  max_lag_tokens: 128
  ablation: true
  ablation_max_series: 32        # must be <= every model's batch_size
  head_layer_stride: 1
  top_k: 5

exemplars:
  enabled: true
  per_family: 3
  max_families: 3                # this corpus has 3 families

clustering:
  enabled: true
  layer: auto
  k: auto
  pca_dim: 50
  max_series: 300
  use_umap: true

sae:
  enabled: false

report:
  enabled: true
  title: Medium run · TimesFM 2.5 vs Chronos-T5, ~300 series (part real data)

stats:
  enabled: true
  n_boot: 500
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50

confirm:
  enabled: true
  source: sealed
  path: /common/home/djk255/Desktop/TSFM Interp/benchmark_medium/private_test
  max_series: 300
  require_seal: true
  alpha: 0.05
