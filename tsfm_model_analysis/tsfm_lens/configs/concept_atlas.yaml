# The Concept Atlas preset (ROADMAP.md sec 37.4 P1): one command for the
# repo's three founding questions -- what interpretable concepts each TSFM
# learns, whether other models share them, and whether they causally move
# the forecast.
#
#     python run.py --config configs/concept_atlas.yaml
#
# Everything below `run:` is `configs/full_report_run_4model.yaml`'s body
# unchanged (its header documents every choice: the four models, Sundial's
# diagnosed benign alignment decay and hence `alignment.on_failure: warn`,
# the n_boot budget, the sec 26 SAE revival recipe -- aux_k, dict_size_policy:
# search, min_train_steps -- that keeps every dictionary under the 30%
# dead-rate gate). Two things differ, and only two:
#   * run.name, so this never writes into that run's directory;
#   * a `concepts:` section enabling the concepts stage, which chains the
#     ablation battery, concept clustering, cross-model transfer and the
#     deterministic descriptions after `sae`. It REQUIRES
#     `sae.persist_features: true` (set below) and refuses at preflight
#     without it.
#
# PRIVATE-EPOCH REQUIREMENT (ROADMAP.md sec 37.10 P7) -- RESOLVED. `confirm.
# path` now points at `benchmark_large/private_epoch1`, a fresh private
# epoch built via `regenerate_private(epoch=1)` and validated against
# `public_dev` with the cross-split check (near-duplicate fraction 1e-05,
# composition equality p>0.66 on tier/group/archetype, energy-distance
# permutation p=0.908, TOST verdict "inconclusive" -- not "not_equivalent")
# specifically so `concept_transfer` claims (registered from dev atlas
# artifacts only, before this epoch is touched) can be confirmed once
# without spending `private_test` (epoch 0) a second time (CLAUDE.md sec
# 6.7). `private_test` (epoch 0) stays reserved for the pre-existing
# l0/l1/l3 hypotheses already confirmed against it.
#
# Known state at the time this preset was written (sec 37.3 P0): on this
# corpus the default clustering floor (`sae.concept_min_members: 3`) leaves
# 11 of 13 targets non-modular, so expect few concepts; which population the
# atlas is built on is sec 37.15 question 6, an open decision.

run:
  name: concept_atlas
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../../benchmark_large/public_dev  # relative to tsfm_lens/ (where run.py is invoked from)
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true
  on_failure: warn   # Sundial's diagnosed, benign mid-depth decay -- see header

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 2      # 20 layers -> 10 capture points
  - name: Chronos-2
    adapter: chronos2
    checkpoint: amazon/chronos-2
    batch_size: 24
    capture_layer_stride: 1      # 12 encoder blocks, no decoder to capture
  - name: Sundial
    adapter: sundial
    checkpoint: thuml/sundial-base-128m
    batch_size: 16               # smallest of the four -- binds every
                                 # "<= every model's batch_size" cap below
    capture_layer_stride: 1      # 12 decoder blocks
  - name: Chronos-Bolt
    adapter: chronos_bolt
    checkpoint: amazon/chronos-bolt-small
    batch_size: 32
    capture_layer_stride: 1      # encoder blocks, deterministic quantile head

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]
  calibration: true

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15
  rsa: true
  rsa_max_series: 800

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 40000
  input_baseline: true

l3:
  enabled: true
  max_series: 800
  corruptions:
    # Same measured, non-default strengths as full_report_run_large*.yaml
    # (measured over 200 series of this repo's own corpus -- see that
    # file's header for the energy numbers). Restated here because this
    # file overrides the whole corruptions block.
    noise: {snr_db: 0.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    frequency_shift: {factor: 2.0}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 8, scale: 10.0}
    smooth: {kernel: 9}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: true
    layer_stride: 2
    corruptions: [deseasonalize, noise, level_shift, spike, warp, dropout]
    max_series: 16                # must be <= every model's batch_size (Sundial: 16)
    per_window: true
    window_stride: 1

lens:
  enabled: true
  layer_stride: 1
  max_series: 16                  # must be <= every model's batch_size (Sundial: 16)
  tuned: true
  tuned_max_series: 800
  val_frac: 0.25
  lambdas: [0.001, 0.01, 0.1, 1.0]
  crystallization_tol: 0.1

attention:
  enabled: true
  patterns: true                  # TimesFM/Chronos-2 real patterns; Sundial/
                                  # Chronos-Bolt degrade to "unsupported" and
                                  # skip, per invariant 8 -- both adapters'
                                  # docstrings declare attention_patterns
                                  # unsupported deliberately
  max_series: 400
  batch_series: 16
  max_lag_tokens: 128
  ablation: true
  ablation_max_series: 16         # must be <= every model's batch_size (Sundial: 16)
  head_layer_stride: 1
  top_k: 5

exemplars:
  enabled: true
  per_family: 3
  max_families: 5                 # this corpus has 5 families -- see header

clustering:
  enabled: true
  layer: auto
  k: auto
  pca_dim: 50
  max_series: 800
  use_umap: true

layer_screen:
  enabled: true
  method: work_bend
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: true
  targets: []                     # "auto" -- layer_screen's own selection, all 4 models
  dict_size_mult: 8
  dict_size_policy: search
  dict_size_ladder: [192, 384, 768, 1536, 3072, 6144]
  max_dead_rate: 0.30
  dict_size_search_margin: 0.03
  dict_size_search_seeds: 2
  min_fidelity: 0.5
  k: 32
  lr: 0.001
  epochs: 60
  min_train_steps: 720
  aux_k: 64
  aux_coef: 0.03125
  aux_dead_steps_frac: 0.028
  n_seeds: 3
  batch_size: 4096
  resample_dead_every_epochs: 5
  forecast_preservation_max_series: 16   # must be <= every model's batch_size (Sundial: 16)
  ground_truth_max_series: 2000
  persist_features: true
  real_data_enabled: true
  real_data_source: "Monash-University/monash_tsf"
  real_data_n_windows: 4000
  real_data_pool_limit: 500

report:
  enabled: true
  verbose: true
  verbose_series: 2
  title: Concept Atlas — TimesFM 2.5, Chronos-2, Sundial, Chronos-Bolt

stats:
  enabled: true
  n_boot: 2000              # 6 pairs x 5 families = 30 tests -- see header
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 40000
  probe_pca_dim: 50
  probe_max_iter: 2000        # CLAUDE.md sec 11.47: the historical 300 does
                              # not converge at this corpus size

confirm:
  enabled: true
  source: sealed
  path: ../../benchmark_large/private_epoch1  # relative to tsfm_lens/ -- see header (sec 37.10 P7)
  max_series: 800
  require_seal: true
  alpha: 0.05
  concept_transfer_n_null: 2000

# ROADMAP.md sec 34 item C1/C2 (2026-09-17): the corpus card and report
# section, added after this run's own config was first written -- this
# points it at the already-computed benchmark_validation report for
# benchmark_large's public_dev split. That report predates item C1.3's
# writer change (no corpus_digest field), so the card must render it under
# the explicit "provenance unverified" transitional label rather than
# either trusting it silently or refusing it -- a real exercise of that
# specific code path, not just the smoke config's synthetic-corpus one.
corpus:
  enabled: true
  validation_report: ../../validation_large/validation_report.json  # relative to tsfm_lens/
concepts:
  enabled: true
  top_k_series: 8          # each feature's own strongest-firing series ablated on
  n_null_directions: 16    # random-direction null draws per candidate
  max_series: 64
  keep_forecasts: 3        # with/without forecast pairs kept for the report overlay
  n_features_per_rule: 12  # used only for a target with no Stage 2 artifact
  describe: true           # deterministic sentences into sae/descriptions.json
  describe_top_features: 8
  n_registered: 20         # ROADMAP.md sec 37.10 P7 decision item 2 (§37.15 q2)
  # ROADMAP.md sec 37 (concept FAMILIES, sae/concept_families.py): a general,
  # human-readable layer above the tight atlas concepts (atlas_min_cosine
  # above). atlas_family_min_members is this layer's own size floor for a
  # DRAFT family (looser than atlas_min_members since a family is meant to
  # be coarser than a concept); atlas_family_assign_min is the cosine every
  # pooled feature must clear against its NEAREST family centroid to be
  # assigned rather than "idiosyncratic". Both default to the values below;
  # written explicitly so a reader does not have to know the dataclass
  # default to see what this preset runs with.
  atlas_family_min_members: 5
  atlas_family_assign_min: 0.5
