# Phase 4 (ROADMAP.md §9) adapter-development scratch config for
# Chronos-2 -- used only for `--discover-layers`/`--check-alignment` while
# building `models/chronos2_adapter.py`, per CLAUDE.md §6.2's "Adding a
# model" workflow. Not a real comparison run.

run:
  name: chronos2_adapter_check
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0

data:
  source: smoke
  context_len: 512
  horizon: 64
  smoke_series_per_family: 8

alignment:
  window: 32
  sanity_check: false

models:
  - name: Chronos-2
    adapter: chronos2
    checkpoint: amazon/chronos-2
    batch_size: 16
    capture_layer_stride: 1
