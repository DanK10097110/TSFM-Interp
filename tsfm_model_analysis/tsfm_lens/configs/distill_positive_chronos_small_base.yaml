# Phase 2c positive case (ROADMAP.md §6.3): does L1/L2's stitching machinery
# separate "shared pretraining lineage" pairs from independently-trained
# pairs? amazon/chronos-t5-small and amazon/chronos-t5-base are the
# documented proxy positive named in §6.3's own checklist -- verified via
# each model's HF README (not guessed): both are fine-tuned from *separately
# pretrained* google/t5-efficient-{small,base} text checkpoints (so they do
# NOT share initialization weights -- this is not literal distillation), but
# BOTH were subsequently trained on the exact same time-series corpus using
# the exact same published Chronos training procedure (arXiv:2403.07815).
# That's the "meaningful pretraining lineage" the checklist asks to confirm
# before assuming it -- shared training data/recipe, independent base
# weights.
#
# Same corpus as configs/medium_run_chronos_base.yaml (the negative pair:
# Chronos-T5-Base vs TimesFM, already extracted, zero new compute needed for
# that side) so the two pairs' L1/L2 numbers are directly comparable.
#
# Deliberately lean: only the stages this deliverable's own statistical test
# needs (l0 for a sanity behavioral read, l1 CKA, l2 stitching-gain-over-
# baseline, internals for eff-dim/probe context) plus report. l3/lens/
# attention/exemplars/clustering/sae/confirm are all off -- this run answers
# one specific question, not a full model comparison.

run:
  name: distill_positive_chronos_small_base
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../../benchmark_medium/public_dev  # relative to tsfm_lens/ (where run.py is invoked from)
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: Chronos-T5-Small
    adapter: chronos
    checkpoint: amazon/chronos-t5-small
    batch_size: 32
    capture_layer_stride: 1       # 6 encoder blocks
  - name: Chronos-T5-Base
    adapter: chronos
    checkpoint: amazon/chronos-t5-base
    batch_size: 24
    capture_layer_stride: 1       # 12 encoder blocks

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15
  rsa: true
  rsa_max_series: 300

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 15000
  input_baseline: true

l3:
  enabled: false

lens:
  enabled: false

attention:
  enabled: false

exemplars:
  enabled: false

clustering:
  enabled: false

layer_screen:
  enabled: false

sae:
  enabled: false

report:
  enabled: true
  title: "Phase 2c positive pair: Chronos-T5-Small vs Chronos-T5-Base (shared training lineage)"

stats:
  enabled: true
  n_boot: 500
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50

confirm:
  enabled: false
