# Feature-steering verification run (report-only task, not a ROADMAP-tracked
# config): a copy of medium_run_chronos_base_feature_ablation_check.yaml with
# only run.name changed (new run dir, so neither medium_run_chronos_base nor
# the feature-ablation check run is touched) and
# sae.feature_steering_* added, to verify the newly-implemented feature
# steering (sae/eval.py::feature_steering_effects,
# analysis/steering.py::evaluate_direction_match) against a real checkpoint +
# real sealed corpus where ground_truth_alignment actually finds matched
# features. Reuses medium_run_chronos_base's already-extracted
# activations.zarr + meta.parquet (copied into the new run dir before
# running) so extraction doesn't redo real GPU work. Invoke with
# --stages sae,report so only the two stages that actually need this
# session's new code run (l0/l1/l2/l3/lens/attention/exemplars/clustering
# would otherwise re-run from scratch in a brand-new run dir and add
# ~10+ minutes for no verification value).

run:
  name: medium_run_chronos_base_feature_steering_check
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false     # true if both models + headroom fit in VRAM

data:
  source: sealed
  path: ../../benchmark_medium/public_dev  # relative to tsfm_lens/ (where run.py is invoked from)
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 2      # 20 layers -> 10 capture points
  - name: Chronos-T5-Base
    adapter: chronos
    checkpoint: amazon/chronos-t5-base
    batch_size: 24               # base is 2x chronos-t5-small; lower batch for VRAM headroom
    capture_layer_stride: 1       # 12 encoder blocks (vs small's 6)

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15         # every family here has >= 40 series
  rsa: true
  rsa_max_series: 300

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 15000
  input_baseline: true

l3:
  enabled: true
  max_series: 300
  corruptions:
    noise: {snr_db: 6.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    frequency_shift: {factor: 2.0}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 3, scale: 6.0}
    smooth: {kernel: 9}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: true
    layer_stride: 2
    corruptions: [deseasonalize, noise, level_shift, spike, warp, dropout]
    max_series: 24                # must be <= every model's batch_size
    per_window: true              # layer x window restoration heatmaps
    window_stride: 1              # full time resolution (dataset is small enough)

lens:
  enabled: true
  layer_stride: 1
  max_series: 24                  # must be <= every model's batch_size
  tuned: true
  tuned_max_series: 300
  val_frac: 0.25
  lambdas: [0.001, 0.01, 0.1, 1.0]
  crystallization_tol: 0.1

attention:
  enabled: true
  patterns: true
  max_series: 150
  batch_series: 16                # base's T=512 attn patterns cost ~2x small's; halved vs medium_run
  max_lag_tokens: 128
  ablation: true
  ablation_max_series: 24         # must be <= every model's batch_size
  head_layer_stride: 1
  top_k: 5

exemplars:
  enabled: true
  per_family: 3
  max_families: 3                 # this corpus has 3 families

clustering:
  enabled: true
  layer: auto
  k: auto
  pca_dim: 50
  max_series: 300
  use_umap: true

layer_screen:
  enabled: true
  method: work_bend
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: true
  targets:                        # pinned for reproducibility -- see note above
    - model: TimesFM
      layer: stacked_xf.18        # final layer: highest tuned_r2_model (0.622) in this run
    - model: Chronos-T5-Base
      layer: encoder.block.6      # highest tuned_r2_model (0.581) in this run
  dict_size_mult: 8
  k: 32
  lr: 0.001
  epochs: 60
  batch_size: 4096
  resample_dead_every_epochs: 5
  forecast_preservation_max_series: 24  # must be <= every target model's batch_size
  ground_truth_max_series: 2000
  real_data_enabled: true
  real_data_source: "Monash-University/monash_tsf"
  real_data_n_windows: 4000
  real_data_pool_limit: 500
  feature_ablation_enabled: true
  feature_ablation_top_k: 5
  feature_ablation_max_series: 24  # must be <= every target model's batch_size (was 32; fixed to satisfy preflight)
  feature_steering_enabled: true
  feature_steering_top_k: 8
  feature_steering_max_series: 24  # must be <= every target model's batch_size (was 32; fixed to satisfy preflight)
  feature_steering_strength_sigma: 2.0

report:
  enabled: true
  title: Feature-steering verification run (copy of medium_run_chronos_base)

stats:
  enabled: true
  n_boot: 500
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50

confirm:
  enabled: true
  source: sealed
  path: ../../benchmark_medium/private_test  # relative to tsfm_lens/ (where run.py is invoked from)
  max_series: 300
  require_seal: true
  alpha: 0.05
