# ROADMAP.md §6.2.1 Stage 1, revised next action (b3): a bigdata store with
# enough TimesFM depth for the ladder's L-C rung to be measurable.
#
# Why this file exists. L-C asks whether `frac_shared` decays as the two
# sources move apart in depth -- model A's layer L against its own layer L+d.
# It is the rung that distinguishes "this metric tracks representational
# distance" from "this metric returns whatever number the architecture
# implies". The 2026-08-13 ladder run could not measure it at all:
# `configs/crosscoder_stage0.yaml` captures TimesFM at `stacked_xf.4` and
# nothing else, so every configured delta ran off the end of the captured
# stack and L-C recorded `too_few_deltas`.
#
# This config is `crosscoder_stage0.yaml` with four more TimesFM layers and no
# other change -- same corpus, same context_len 448, same seed, same batch
# sizes, same Chronos layer. The extra capture points cost storage and hook
# bandwidth, not forward passes, so the run's activations for the shared layers
# are the same computation as before.
#
# THE LAYER SET IS CHOSEN, NOT ARBITRARY. `layer_at_offset` counts deltas in
# *captured positions*, not in blocks, so a captured set of
# {4, 5, 6, 8, 12} makes captured-position deltas 1,2,3,4 land on real block
# gaps of 1,2,4,8 -- the geometric ladder L-C's design actually wants. Run it
# as `--deltas 1,2,3,4` and record that mapping; the ladder's DEFAULT
# `--deltas 1,2,4,8` also works here but silently reads block gaps 1,2,8 and
# drops one rung, which is a worse ladder measured under a better-looking flag.
# Changing this layer set without changing the delta flag changes what L-C
# means with no diff to catch it (`CLAUDE.md` §11.24).
#
# ROW-IDENTITY REQUIREMENT. This store must be usable in place of
# `runs/crosscoder_stage0_bigdata` for L-A/L-D/V0, whose numbers are already
# recorded at 46382 rows. Same corpus + same context_len + same seed => the
# same admitted series in the same order, so `TimesFM/stacked_xf.4` and
# `Chronos-T5-Base/encoder.block.10` must come back element-for-element equal
# between the two stores. Verify that before reusing any recorded number
# against this store rather than assuming it.
#
# Note for anyone reading a `--check-alignment` line from this run: Chronos at
# context_len 448 reads a diagonal-hit fraction of 0.50, not 1.00. That is
# §11.26's context-length-specific probe calibration, diagnosed and expected
# here -- it is not evidence of a broken adapter, and it is identical to what
# `crosscoder_stage0.yaml` already produces.

run:
  name: crosscoder_stage0_bigdata_layers
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../../tsfm_benchmark/benchmark_out_full1/public_dev  # relative to tsfm_lens/
  context_len: 448
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    layer_regex: '^stacked_xf\.(4|5|6|8|12)$'   # see THE LAYER SET IS CHOSEN above
    capture_layer_stride: 1
  - name: Chronos-T5-Base
    adapter: chronos
    checkpoint: amazon/chronos-t5-base
    batch_size: 24
    layer_regex: '^encoder\.block\.10$'          # unchanged: the L1 peak-CKA pair's Chronos side
    capture_layer_stride: 1

l0: {enabled: false}
l1: {enabled: false}
l2: {enabled: false}
l3: {enabled: false}
lens: {enabled: false}
attention: {enabled: false}
internals: {enabled: false}
clustering: {enabled: false}
exemplars: {enabled: false}
confirm: {enabled: false}
layer_screen: {enabled: false}
budget: {enabled: false}
sae: {enabled: false}
report: {enabled: false}
