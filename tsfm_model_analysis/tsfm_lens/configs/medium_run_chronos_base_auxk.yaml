# ROADMAP.md sec 23.2 item A1: re-run the production `sae` stage's two
# pinned targets (TimesFM/stacked_xf.18, Chronos-T5-Base/encoder.block.6)
# with AuxK dead-atom revival turned on (aux_k/aux_coef/aux_dead_steps),
# matching the crosscoder Stage 0 gate config's already-proven-effective
# setting (configs/crosscoder_stage0_gate.yaml: k=48, aux_k=64,
# aux_coef=0.03125, aux_dead_steps=20), which revived per-model baseline
# dictionaries on these exact two checkpoints to well under 30% dead at
# 5/5 seeds. Everything outside `run.name` and the `sae:` block is a
# byte-identical copy of configs/medium_run_chronos_base.yaml -- do not
# re-extract or reload checkpoints; this run directory is a copy of
# runs/medium_run_chronos_base with only the extraction/l0/l1/l2/l3/
# internals/lens/layer_screen/budget/clustering/attention/exemplars
# artifacts reused (their config fingerprints are unaffected by anything
# changed here) and only `sae`/`report` rerun.
#
# `sae.n_seeds: 3` is this repo's existing seed-floor mechanism
# (ROADMAP.md sec 13's SAE repeat-run-variance item, `sae/train.py::run_sae`)
# -- it retrains each target at `run.seed + 0..n_seeds-1` against the same
# frozen store and records dead_feature_rate/reconstruction_fidelity/
# forecast-preservation spread across seeds. It does NOT repeat
# ground_truth_alignment (by design -- only the primary seed's SAE is
# checkpointed and put through ground-truth alignment/ablation/steering,
# per SAEConfig.n_seeds's own docstring), so ground_truth_alignment is only
# available for the primary seed (seed 0) here.
#
# `sae.persist_features: true` is newly turned on (was unset/false in the
# original config) so the primary seed's encoded features are written back
# to the store for the E16 cross-model feature-matching re-measurement
# (`sae/matching.py::match_cross_model_features`), which needs persisted
# per-target feature arrays. This also triggers `sae/feature_geometry.py`'s
# feature-space CKA as a side effect (writes `l1/cka_sae.json` in this copy
# only -- does not touch the canonical run's `l1/cka_sae.json`, since this
# is a fully separate run directory).

run:
  name: medium_run_chronos_base_auxk
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false     # true if both models + headroom fit in VRAM

data:
  source: sealed
  path: ../../benchmark_medium/public_dev  # relative to tsfm_lens/ (where run.py is invoked from)
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 2      # 20 layers -> 10 capture points
  - name: Chronos-T5-Base
    adapter: chronos
    checkpoint: amazon/chronos-t5-base
    batch_size: 24               # base is 2x chronos-t5-small; lower batch for VRAM headroom
    capture_layer_stride: 1       # 12 encoder blocks (vs small's 6)

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15         # every family here has >= 40 series
  rsa: true
  rsa_max_series: 300

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 15000
  input_baseline: true

l3:
  enabled: true
  max_series: 300
  corruptions:
    noise: {snr_db: 6.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    frequency_shift: {factor: 2.0}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 3, scale: 6.0}
    smooth: {kernel: 9}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: true
    layer_stride: 2
    corruptions: [deseasonalize, noise, level_shift, spike, warp, dropout]
    max_series: 24                # must be <= every model's batch_size
    per_window: true              # layer x window restoration heatmaps
    window_stride: 1              # full time resolution (dataset is small enough)

lens:
  enabled: true
  layer_stride: 1
  max_series: 24                  # must be <= every model's batch_size
  tuned: true
  tuned_max_series: 300
  val_frac: 0.25
  lambdas: [0.001, 0.01, 0.1, 1.0]
  crystallization_tol: 0.1

attention:
  enabled: true
  patterns: true
  max_series: 150
  batch_series: 16                # base's T=512 attn patterns cost ~2x small's; halved vs medium_run
  max_lag_tokens: 128
  ablation: true
  ablation_max_series: 24         # must be <= every model's batch_size
  head_layer_stride: 1
  top_k: 5

exemplars:
  enabled: true
  per_family: 3
  max_families: 3                 # this corpus has 3 families

clustering:
  enabled: true
  layer: auto
  k: auto
  pca_dim: 50
  max_series: 300
  use_umap: true

layer_screen:
  enabled: true
  method: work_bend
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: true
  targets:                        # pinned -- identical to medium_run_chronos_base.yaml
    - model: TimesFM
      layer: stacked_xf.18        # final layer: highest tuned_r2_model (0.622) in this run
    - model: Chronos-T5-Base
      layer: encoder.block.6      # highest tuned_r2_model (0.581) in this run
  dict_size_mult: 8
  k: 48                            # was 32 -- matches crosscoder_stage0_gate.yaml
  aux_k: 64                        # was 0 -- ROADMAP.md sec 23.2 A1: turn on AuxK dead-atom revival
  aux_coef: 0.03125                # explicit; unchanged from SAEConfig default
  aux_dead_steps: 20               # explicit; unchanged from SAEConfig default
  n_seeds: 3                       # ROADMAP.md sec 13's seed-floor mechanism -- >=3 seeds per A1
  lr: 0.001
  epochs: 60
  batch_size: 4096
  resample_dead_every_epochs: 5
  forecast_preservation_max_series: 24  # must be <= every target model's batch_size
  ground_truth_max_series: 2000
  persist_features: true           # was false/unset -- needed for the E16 re-measurement (step 5)
  real_data_enabled: true
  real_data_source: "Monash-University/monash_tsf"
  real_data_n_windows: 4000
  real_data_pool_limit: 500

report:
  enabled: true
  title: Size-variant control · TimesFM 2.5 vs Chronos-T5-Base, ~300 series (part real data) -- AuxK SAE re-run (ROADMAP.md sec 23.2 A1)

stats:
  enabled: true
  n_boot: 500
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50

confirm:
  enabled: true
  source: sealed
  path: ../../benchmark_medium/private_test  # relative to tsfm_lens/ (where run.py is invoked from)
  max_series: 300
  require_seal: true
  alpha: 0.05
