# Phase 4 (ROADMAP.md §9) validation run: Chronos-2 (the new adapter) vs
# TimesFM, on the same corpus as configs/medium_run_chronos_base.yaml.
# Deliberately includes l3 (with per-window patching, exercising the
# hooks.py token_patch fix found while building this adapter) and attention
# (patterns + head/MLP ablation, exercising output_mean_ablate/
# input_slice_ablate) -- the two mechanisms a lean l0/l1/l2-only run
# wouldn't touch. l2/lens/clustering/sae/confirm stay off; this is an
# adapter-validation run, not a flagship comparison.

run:
  name: chronos2_phase4_check
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../../benchmark_medium/public_dev
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 2
  - name: Chronos-2
    adapter: chronos2
    checkpoint: amazon/chronos-2
    batch_size: 16
    capture_layer_stride: 1

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15
  rsa: false

l2:
  enabled: false

l3:
  enabled: true
  max_series: 150
  corruptions:
    noise: {snr_db: 6.0}
    level_shift: {position_frac: 0.6, scale: 3.0}
  patching:
    enabled: true
    layer_stride: 2
    corruptions: [noise, level_shift]
    max_series: 16
    per_window: true
    window_stride: 2

lens:
  enabled: false

attention:
  enabled: true
  patterns: true
  max_series: 64
  batch_series: 8
  max_lag_tokens: 64
  ablation: true
  ablation_max_series: 16
  head_layer_stride: 1
  top_k: 5

exemplars:
  enabled: false
clustering:
  enabled: false
layer_screen:
  enabled: false
sae:
  enabled: false
confirm:
  enabled: false

report:
  enabled: true
  title: "Phase 4 adapter check: Chronos-2 vs TimesFM"

stats:
  enabled: true
  n_boot: 300
  n_boot_heavy: 150
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50
