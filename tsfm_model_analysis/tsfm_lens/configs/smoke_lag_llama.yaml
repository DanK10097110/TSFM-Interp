# ROADMAP.md Item D2.1 step 7: real Lag-Llama checkpoint paired with a mock
# architecture, full pipeline (not just L0), to confirm nothing in extraction/
# alignment/L1/L2/etc breaks on this adapter's real shapes end to end. Small
# scale (`max_series`/`context_len`) so it stays a smoke check, not a full run.
#
# Checkpoint license (D2.1 step 2): Apache License 2.0 (verified against
# https://github.com/time-series-foundation-models/lag-llama's own LICENSE
# file and preserved verbatim in every vendored file's header under
# `models/contrib/_lag_llama_vendor/`).

run:
  name: smoke_lag_llama
  out_dir: runs
  device: cuda
  dtype: float32
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../../benchmark_medium/public_dev
  context_len: 480
  horizon: 64
  family_key: auto
  max_series: 40

alignment:
  window: 32
  sanity_check: true

models:
  - name: LagLlama
    adapter: lag_llama
    checkpoint: time-series-foundation-models/Lag-Llama
    batch_size: 64
    capture_layer_stride: 1
  - name: patchy
    adapter: mock_patch
    batch_size: 64

l0: {enabled: true, quantiles: [0.1, 0.5, 0.9]}
budget: {enabled: true}
layer_screen: {enabled: true}
internals: {enabled: true}
lens: {enabled: true}
l1: {enabled: true, layer_stride: 1, max_rows: 4000, min_family_series: 5, rsa: false}
l2: {enabled: true, layer_stride: 1, max_rows: 2000, val_frac: 0.3}
l3: {enabled: true}
attention: {enabled: true, batch_series: 8, ablation_max_series: 64}
clustering: {enabled: true}
exemplars: {enabled: true}
sae: {enabled: false}
confirm: {enabled: false}
stats: {enabled: true, n_boot: 300, n_boot_heavy: 150, ci: 0.95, alpha: 0.05, min_series: 8}
report: {enabled: true, verbose: false}
