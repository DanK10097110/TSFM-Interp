# REVIVAL variant of configs/full_report_run_large.yaml (2026-09-03, user
# instruction: "if 87 failed, why not keep going? don't simply accept that it
# is failing"). Identical to that file in EVERY respect except the `sae:`
# block, so a diff between the two run directories isolates the SAE recipe
# and nothing else.
#
# WHAT THIS FIXES. `full_report_run_large` renders 8 of its 11 sparse
# dictionaries FAILING the 30% dead-feature gate (0.877-0.977 dead for
# TimesFM and Chronos-T5-Base; only Chronos-2's three targets pass). That is
# not a property of those checkpoints -- ROADMAP.md sec 23.2 A1 and sec 6.2.1
# Stage 0 both measured the cure, and sec 25.20 measured its cost. The cure
# is three settings this file turns on and that config leaves at their
# reproducibility-preserving defaults:
#
#   aux_k               the OpenAI-style dead-latent auxiliary loss. Stage 0's
#                       own value (64 atoms, coef 1/32). On its own at
#                       dict_size_mult: 8 it only reached ~78-91% dead
#                       (A1's first validation), which is why the next two
#                       settings are not optional extras.
#   dict_size_policy    `search`: train a ladder per target and keep the
#                       LARGEST size whose dead rate clears the bar with
#                       margin. This is the piece that makes the recipe
#                       honest across models of different effective
#                       dimensionality -- sec 25.16 measured alive-atom count
#                       tracking a layer's own `effective_dim` at exponent
#                       1.02 while `dict_size` and `d_in` predict it not at
#                       all, so ONE fixed dictionary size cannot be right for
#                       eleven targets spanning eff-dim ~2.5 to ~50.
#   min_train_steps     A1 finding: `epochs: 60` on this corpus is too few
#                       optimizer steps for AuxK's revival to take effect at
#                       all; the floor raises the effective epoch count.
#
# WHAT IS HELD FIXED, AND WHY THAT MATTERS. The constant across the eleven
# targets is the POLICY, not the number -- exactly the discipline
# configs/scaling_ladder_chronos.yaml states for its own `sae.targets: auto`.
# A per-target dictionary size chosen by a per-target search is the only way
# to compare eleven layers on equal footing here; a single hand-set size
# would advantage whichever eff-dim regime it happened to suit, which is a
# fairness problem of exactly the sec 18 kind.
#
# LADDER SPACING IS LOG, AND DELIBERATELY COARSER THAN sae_revival.yaml's.
# That config's 10-candidate ladder was densified around ONE model's
# dead-rate boundary (128->256) because it was validating a threshold at 5
# search seeds on 2 targets. This run has 11 targets and is producing a
# report, not a threshold: 6 log-spaced candidates at 2 search seeds costs
# 15 trainings per target against sae_revival's 55, and the `margin` below
# is what protects against landing on a boundary candidate rather than ladder
# density. The ladder's TOP is 6144 -- the size `full_report_run_large`
# itself used (dict_size_mult 8 x d_in 768) -- so a target that is already
# alive at the production size (all three Chronos-2 layers) can keep it and
# is not silently shrunk by the search.
#
# WHAT THIS COSTS, STATED BEFORE IT IS PAID (sec 25.20's measurement, on a
# within-model comparison, not a cross-architecture one): revival is
# free-or-better for Chronos-T5-Base (gap over its own permutation null
# +0.2362 vs +0.2294 dead, one MORE structural field covered, fidelity 0.901
# vs 0.840) and genuinely COSTS correlational alignment signal for TimesFM
# (+0.1665 -> +0.1086). Read the two runs' `alignment vs null` columns side
# by side rather than assuming revival is a free win; that column, not the
# dead rate, is what says whether a dictionary is worth reading.
#
# EVERY NUMBER RECORDED AGAINST `full_report_run_large` STAYS VALID AND
# REGENERABLE -- this is a new run directory, not an edit to that one. Both
# reports exist; neither supersedes the other by fiat.
#
#
# ---- inherited header of configs/full_report_run_large.yaml ----
#
# Full-feature run, THREE models, on the LARGE corpus (2026-08-30, user
# request): every stage this pipeline has, on real checkpoints, into one
# report -- run as a PANEL rather than a pair, so the run-shape machinery
# (ROADMAP.md sec 24.3) is exercised end to end on real weights.
#
# This is configs/full_report_run_3model.yaml pointed at `benchmark_large`
# instead of `benchmark_medium`, with the corpus-sized caps raised to match.
# What that buys, and what it does not:
#
#   * 1000 series per split instead of 288, across FIVE families instead of
#     three -- and critically, 41% real-derived instead of 20%, spanning all
#     three real-derived generators (`mixture`, `block_bootstrap`,
#     `sequential_par`) rather than only `mixture`. Each clears
#     `min_family_series: 15` with real margin at both splits, so per-family
#     statistics are resolvable on the REAL side, not just the synthetic one.
#     See tsfm_benchmark/configs/large_run.yaml for the corpus design.
#
#   * The `max_series: 300` caps this file inherited were sized for a
#     288-series corpus -- i.e. "all of it". Left at 300 against 1000 series
#     they would silently discard two thirds of the new data and the run
#     would cost the same as the old one while reporting the same power. They
#     are raised to 800 (400 for attention, which holds [batch, heads, T, T]
#     per layer and is the memory-critical one -- CLAUDE.md sec 6.5).
#
#   * The batch-capped values (24) are NOT scaled: they must stay <= every
#     model's batch_size regardless of corpus size, which is a property of the
#     patching/lens machinery, not of the data.
#
# The `confirm` note below still applies but with one difference worth stating:
# this run tests against `benchmark_large`'s OWN private split, which no run
# has touched before -- so unlike full_report_run_3model, its confirm verdicts
# are a genuine one-shot confirmation rather than a demonstration of the
# mechanism. That makes this private split a spent consumable afterward.
#
# It is configs/full_report_run.yaml with a third architecture added and NOTHING
# disabled by hand: L0, L1, L2 and clustering measure all C(3,2) = 3 pairs;
# L3's fingerprint agreement, exemplar selection and `confirm` stay pair-shaped
# by design and are reported against the designated reference pair, which the
# fairness card names. Nothing else changed except the two things a third model
# forces, both stated rather than silent:
#
#   stats.n_boot        500 -> 2000. A bootstrap p is floored at 1/n_boot and
#                       L0 Holm-corrects over (pair x family) jointly, so 3
#                       pairs x 3 families = 9 tests need n_boot >= 9/alpha =
#                       180 merely to be satisfiable. 500 would work; 2000
#                       leaves real resolution rather than bare satisfiability.
#                       `run.py --config <this> --doctor` prints the arithmetic.
#   sae.targets         pinned -> auto. A pinned pair of layers cannot name a
#                       third model's target, and inventing one by hand would be
#                       a choice checked nowhere -- `auto` consumes the
#                       layer_screen stage's own selection for every model.
#                       This is the one place this run does NOT reproduce
#                       full_report_run's recorded SAE numbers, deliberately.
#
# Third model: amazon/chronos-2 -- encoder-only with NO decoder at all (unlike
# Chronos-T5's encoder-decoder and TimesFM's decoder-only stack), so the panel
# spans three genuinely different topologies rather than two plus a size
# variant. Its declared token->time map verifies at a perfect 1.00 diagonal-hit
# fraction at every layer (CLAUDE.md sec 6.2), which is why it was chosen over
# Sundial, whose alignment probe decays with depth at this repo's default
# impulse amplitude and would make a gate failure ambiguous.
#
# `confirm` is ON, and that is a real cost worth stating rather than burying:
# the private split is a consumable (CLAUDE.md sec 6.7). Unlike the runs
# against benchmark_medium, this one draws on `benchmark_large`'s private
# split, which nothing has tested against before -- so these verdicts ARE a
# one-shot confirmation and the split is spent afterward. Mint a fresh epoch
# (`regenerate_private(epoch=N)`) before quoting any later confirmation.

run:
  name: full_report_run_large_revived
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false     # true if both models + headroom fit in VRAM

data:
  source: sealed
  path: ../../benchmark_large/public_dev  # relative to tsfm_lens/ (where run.py is invoked from)
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 2      # 20 layers -> 10 capture points
  - name: Chronos-T5-Base
    adapter: chronos
    checkpoint: amazon/chronos-t5-base
    batch_size: 24               # base is 2x chronos-t5-small; lower batch for VRAM headroom
    capture_layer_stride: 1       # 12 encoder blocks (vs small's 6)
  - name: Chronos-2
    adapter: chronos2
    checkpoint: amazon/chronos-2
    batch_size: 24               # matches the lowest batch above, so every
                                 # `max_series: 24` cap below stays valid
    capture_layer_stride: 1       # 12 encoder blocks, no decoder to capture

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]
  calibration: true               # reliability curve / PIT / crossing rate (E10)

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15         # every family here has >= 40 series
  rsa: true
  rsa_max_series: 800

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 40000              # WINDOW rows, not series. 1000 series x 16
                               # windows = 16000, so the inherited 15000 (sized
                               # for a 288-series corpus, where it never bound)
                               # would now silently discard most of the corpus
                               # this run exists to use.
  input_baseline: true

l3:
  enabled: true
  max_series: 800
  corruptions:
    # noise and spike carry the two strengths raised from the historical
    # defaults. At snr_db 6.0 / count 3, scale 6.0 they perturbed the input by
    # a measured energy of 0.199 and 0.167 against level_shift's 2.853 -- weak
    # enough to read as "this corruption does nothing" on a shared linear axis
    # when what was actually small was the perturbation, not the model's
    # response. The values below measure 0.790 and 1.230 (spike also goes from
    # 0.58% to 1.55% of timesteps touched), comparable to the rest of the
    # battery without reaching level_shift's outsized value. Measured over 200
    # series of this repo's own corpus, not assumed. These match config.py's
    # defaults; they are restated here because this file overrides the whole
    # corruptions block, so a default change would otherwise not reach it.
    noise: {snr_db: 0.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    frequency_shift: {factor: 2.0}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 8, scale: 10.0}
    smooth: {kernel: 9}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: true
    layer_stride: 2
    corruptions: [deseasonalize, noise, level_shift, spike, warp, dropout]
    max_series: 24                # must be <= every model's batch_size
    per_window: true              # layer x window restoration heatmaps
    window_stride: 1              # full time resolution (dataset is small enough)

lens:
  enabled: true
  layer_stride: 1
  max_series: 24                  # must be <= every model's batch_size
  tuned: true
  tuned_max_series: 800
  val_frac: 0.25
  lambdas: [0.001, 0.01, 0.1, 1.0]
  crystallization_tol: 0.1

attention:
  enabled: true
  patterns: true
  max_series: 400
  batch_series: 16                # base's T=512 attn patterns cost ~2x small's; halved vs medium_run
  max_lag_tokens: 128
  ablation: true
  ablation_max_series: 24         # must be <= every model's batch_size
  head_layer_stride: 1
  top_k: 5

exemplars:
  enabled: true
  per_family: 3
  max_families: 3                 # this corpus has 3 families

clustering:
  enabled: true
  layer: auto
  k: auto
  pca_dim: 50
  max_series: 800
  use_umap: true

# Layer screening (ROADMAP.md §6.1.1) runs by default ahead of `sae`, and in
# THIS config its selection is load-bearing rather than merely visible:
# `sae.targets` is `[]` ("auto"), so what this stage picks is what the SAE
# stage trains on, for each of the three models. That is the deliberate
# difference from full_report_run.yaml, whose pinned targets exist to
# reproduce already-recorded numbers for two named layers.
layer_screen:
  enabled: true
  method: work_bend
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: true
  targets: []                     # "auto" -- resolved from the layer_screen stage's
                                  # own per-model selection, for ALL THREE models.
  dict_size_mult: 8               # inert once dict_size_policy: search resolves a size;
                                  # kept so this file still parses under the old policy
                                  # for a byte-diff against the production config.
  dict_size_policy: search
  dict_size_ladder: [192, 384, 768, 1536, 3072, 6144]
  max_dead_rate: 0.30             # the search target AND the gate the report renders
  dict_size_search_margin: 0.03   # the margin fix (ROADMAP.md sec 23.2 A1): without it
                                  # `max(passing, key=dict_size)` locks onto whichever
                                  # candidate sits exactly ON the bar, which is how the
                                  # first validation run picked a 0.304-mean size.
  dict_size_search_seeds: 2       # two draws per candidate, not one -- a single
                                  # stochastic training per size is what let the first
                                  # validation record a collapsed reconstruction
                                  # (fidelity -0.99) as a passing candidate.
  min_fidelity: 0.5               # and this is the floor that would have caught it.
  k: 32
  lr: 0.001
  epochs: 60
  min_train_steps: 720            # raises the effective epoch count at this corpus's
                                  # row count; AuxK cannot revive anything in 60 epochs
                                  # worth of steps here (A1 finding 2).
  aux_k: 64                       # Stage 0's own revival budget
  aux_coef: 0.03125
  aux_dead_steps_frac: 0.028      # Stage 0's warm-up FRACTION, not its absolute step
                                  # count -- A1 finding 4.
  n_seeds: 3                      # a real seed floor, so every SAE delta in the report
                                  # is readable against its own spread rather than
                                  # against nothing (ROADMAP.md sec 13, sec 18 F6). 3 not
                                  # 5: 11 targets, and 3 is enough for a spread.
  batch_size: 4096
  resample_dead_every_epochs: 5
  forecast_preservation_max_series: 24  # must stay <= every model's batch_size
  ground_truth_max_series: 2000
  persist_features: true
  real_data_enabled: true         # UNCHANGED from production: A1 finding 1 measured that
                                  # real rows excite FEWER directions, not more, so this
                                  # is not the cause of the dead rate and turning it off
                                  # would make this an unfair test of the fix.
  real_data_source: "Monash-University/monash_tsf"
  real_data_n_windows: 4000
  real_data_pool_limit: 500
report:
  enabled: true
  verbose: true                   # narrated per-series L3 patching case studies
  verbose_series: 2
  title: TimesFM 2.5 vs Chronos-T5-Base vs Chronos-2 — full-feature panel run

stats:
  enabled: true
  n_boot: 2000              # 3 pairs x 3 families -- see header
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 40000              # WINDOW rows, not series. 1000 series x 16
                               # windows = 16000, so the inherited 15000 (sized
                               # for a 288-series corpus, where it never bound)
                               # would now silently discard most of the corpus
                               # this run exists to use.
  probe_pca_dim: 50
  probe_max_iter: 2000         # The historical 300 does NOT converge at this
                               # corpus size (14 ConvergenceWarnings); at 2000
                               # all 34 layers converge. Measured rather than
                               # assumed, by re-running the stage both ways on
                               # this corpus: probe accuracy moves by at most
                               # 0.0026 and in BOTH directions -- an order of
                               # magnitude inside the bootstrap CIs, so no
                               # conclusion moves. `converged` is recorded per
                               # layer, so a future corpus outgrowing even 2000
                               # says so in the artifact, not only on stderr.

confirm:
  enabled: true
  source: sealed
  path: ../../benchmark_large/private_test  # relative to tsfm_lens/ (where run.py is invoked from)
  max_series: 800
  require_seal: true
  alpha: 0.05
