# Layer-screening bake-off experiment, v4 (ROADMAP.md §6.1.1 / §6.1.1-E,
# corpus-subsampling-noise fix).
#
# Same experiment as configs/layer_screen_experiment_v2.yaml (TimesFM +
# Chronos-T5-Small + Sundial, all at capture_layer_stride: 1 for a fair
# all-layers comparison), with one change: `data.max_series`/`l3.max_series`
# are no longer set at all. §13's second-sampling-seed test found that a
# routine reseed (76.8% row overlap between the two 220-of-288-row samples)
# flipped `work_bend`'s beats_random verdict on 2 of 3 architectures, even
# though every selector's own layer choices stayed bit-identical across
# seeds -- isolating the actual noise source to the bake-off's *gold*
# ranking (one stochastic SAE-training run per layer), not the corpus
# sample or the selectors. This config closes off the corpus-sample half of
# that noise source directly: `benchmark_medium/public_dev` is only 288
# rows, small enough that subsampling down to 220 bought little in compute
# and cost real determinism -- omitting `max_series` (its default is None,
# `config.py` DataConfig) uses the full, fixed 288-row corpus regardless of
# `run.seed`, so extraction and every downstream selector/gold computation
# sees identical activations across seeds by construction. The remaining
# noise source -- SAE-training stochasticity inside `build_gold_ranking`
# itself -- is fixed separately in `analysis/layer_screen_bakeoff.py` via
# `n_gold_replicates` (default 3, averaged) rather than in config.
#
# Stage set is otherwise unchanged from v2: extract, l0 (forecasts),
# internals (eff-dim/probe cross-check), l3 sensitivity-only (second gold
# signal, no per-window patching) -- lens, attention, clustering, sae,
# confirm, l1, l2 all off.

run:
  name: layer_screen_experiment_v4_seed1
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 1
  keep_models_loaded: false

data:
  source: sealed
  path: ../../benchmark_medium/public_dev  # relative to tsfm_lens/ (where run.py is invoked from)
  context_len: 512
  horizon: 64
  # max_series intentionally omitted -- see header note; full 288-row corpus, no sampling.
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 1      # ALL 20 layers -- see header note
  - name: Chronos-T5-Small
    adapter: chronos
    checkpoint: amazon/chronos-t5-small
    batch_size: 32
    capture_layer_stride: 1      # 6 encoder blocks, already all of them
  - name: Sundial
    adapter: sundial
    checkpoint: thuml/sundial-base-128m
    batch_size: 16
    capture_layer_stride: 1      # 12 layers, all of them

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: false

l2:
  enabled: false

l3:
  enabled: true
  # max_series intentionally omitted -- see header note; l3's own default (512) already
  # exceeds the corpus size, so this was never actually capping anything smaller than
  # `data.max_series` was, but omitted anyway so no knob in this config subsamples.
  corruptions:
    noise: {snr_db: 6.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 3, scale: 6.0}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: false  # per-window patching is expensive and not needed here; sensitivity
                     # fingerprints alone give §6.1.1-E's secondary gold signal.

lens:
  enabled: false

attention:
  enabled: false

exemplars:
  enabled: false

clustering:
  enabled: false

# The pipeline's own default layer_screen stage (ROADMAP.md §6.1.1, now
# wired in ahead of `sae` in every config) runs the bake-off winner
# (work_bend) as a cheap sanity artifact here too -- independent of, and far
# cheaper than, run_layer_screen_bakeoff.py's full three-selector-vs-SAE-gold
# comparison below, which remains the actual experiment this config exists
# for. Only relevant if `layer_screen` is included in `--stages` explicitly;
# the documented `--stages extract,l0,internals,l3` command above does not
# run it.
layer_screen:
  enabled: true
  method: work_bend
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: false  # run_layer_screen_bakeoff.py trains its own per-layer SAEs directly

report:
  enabled: false

stats:
  enabled: true
  n_boot: 200
  n_boot_heavy: 100
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50

confirm:
  enabled: false
