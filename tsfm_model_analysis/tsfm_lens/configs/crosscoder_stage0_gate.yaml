# ROADMAP.md §6.2.1 Stage 0 — the configuration that clears the gate.
#
# Supersedes `crosscoder_stage0_winner.yaml` as Stage 0's answer, and does not
# replace it: that file records the k sweep's winner under the *matched-size*
# criterion and stays executable and correct about what it measured. This one
# is the first configuration to satisfy all three artifacts at once, under the
# per-model baseline sizing decided 2026-08-13.
#
# Consumed by `run_crosscoder_stage0.py --params configs/crosscoder_stage0_gate.yaml`,
# which builds a one-row sweep from it — so the numbers recorded at the bottom
# are regenerable by a command that reads these exact values rather than by
# retyping them.
#
# Provenance: `--grid gate --baseline-dict-sizes 576,512` at seeds 0–4 over the
# store built by `configs/crosscoder_stage0.yaml` (46382 aligned rows). The full
# five-seed table is in ROADMAP.md §6.2.1's finding (17).

# The activation store this was measured against. Relative to tsfm_lens/,
# matching every other config in this directory (CLAUDE.md invariant 11).
run: runs/crosscoder_stage0_bigdata

# The L1 peak-CKA layer pair — where the cross-model geometry is strongest,
# which is the only place a joint dictionary has a reason to exist.
layer_a: stacked_xf.4        # TimesFM-2.5-200M
layer_b: encoder.block.10    # Chronos-T5-Base

# Measured effective dimensionality of each layer above, from
# runs/medium_run_chronos_base/internals/profile.json. Both the alive floor
# (20x eff_dim) and `k` are set against these, not against hidden width.
eff_dims: [28.15, 13.93]

# Each per-model TopKSAE baseline's own dictionary size, in model order:
# TimesFM 576, Chronos-T5-Base 512. Top-level rather than under `train:` so it
# reaches the run's `exit_criteria` record as well as the row — an artifact
# that does not say which sizing rule scored it is not interpretable later
# (CLAUDE.md §11.24).
#
# Neither size is chosen to be easy, and TimesFM's is close to maximally
# strict: its alive floor is 563, so a 576-atom dictionary has to keep 97.7%
# of its atoms alive to pass, and 576 is the smallest measured size above the
# floor at all. 512 is the only size in the entire recorded sweep at which the
# Chronos baseline passes. See ROADMAP.md §6.2.1 finding (17)'s margin note.
baseline_dict_sizes: [576, 512]

train:
  # 1024 atoms. Not headroom this time but the binding choice: at 896 the
  # crosscoder passes at only 3 of 5 seeds (seeds 1 and 4 fall to fidelity
  # 0.679 and 0.659, below the 0.70 bar) while at 1024 every seed passes.
  # Larger dictionaries are *more* stable here, which is the opposite of the
  # per-model baselines' behaviour and is finding (17)'s main result.
  dict_size: 1024

  # The smallest k that cleared the k sweep; unchanged from the winner config,
  # deliberately, so this row differs from it in dictionary size alone.
  k: 48

  epochs: 60

  # AuxK (the OpenAI-style dead-latent auxiliary loss, sae/models.py). Off by
  # default everywhere else in the repo so prior numbers stay regenerable; on
  # here because it is what makes the gate reachable at all.
  aux_k: 64
  aux_coef: 0.03125
  aux_dead_steps: 20

  # 0 = derive as epochs // 5, matching every other Stage 0 row.
  resample_every: 0

seed: 0

# The measured result of exactly this configuration at seed 0, at full
# precision, plus the five-seed spread the gate verdict actually rests on —
# a single seed cannot establish a 5/5 claim, and recording only seed 0 here
# would invite exactly that misreading.
expected:
  crosscoder:
    fidelity_a: 0.7362681170891777   # TimesFM
    fidelity_b: 0.7348360563535948   # Chronos-T5-Base
    dead_feature_rate: 0.0322265625
    n_alive: 991
    l0_actual: 48.0
  # Both per-model baselines pass at their own sizes, at every seed. This is
  # what `crosscoder_stage0_winner.yaml` could not say: under matched sizing
  # the Chronos baseline failed on dead rate at every k tried.
  baseline_a_passes: true
  baseline_b_passes: true
  # Seeds 0-4 of `--grid gate`, dict 1024. Worst seed on each axis, so a rerun
  # that lands outside these bounds is a real change rather than seed noise.
  five_seed:
    n_passing: 5
    dead_feature_rate_max: 0.1845703125     # seed 1
    n_alive_min: 835                        # seed 1
    fidelity_min: 0.7242834675826152        # seed 1, Chronos-T5-Base
