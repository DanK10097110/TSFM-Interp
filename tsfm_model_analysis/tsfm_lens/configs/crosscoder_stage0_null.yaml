# ROADMAP.md §6.2.1 Stage 1, revised next action (b2): the ladder's L-B hard
# null, re-extracted at the bigdata row count.
#
# Why this file exists. L-B pairs the real crosscoder (TimesFM <-> Chronos)
# against a null crosscoder (TimesFM <-> TimesFM's own `random_init` twin), and
# it is the rung that matters most -- it asks whether a joint dictionary finds
# more shared structure between two *trained* models than between one model and
# an untrained copy of itself. The 2026-08-13 ladder run could not answer it:
# `runs/null_timesfm_random` holds 4608 aligned rows against the real run's
# 46382, and the ladder refuses to pair across corpora rather than quietly
# comparing dictionaries trained on different amounts of data. That refusal was
# correct -- Stage 1 finding (b) had *just* shown the dead-feature rate falling
# 0.331 -> 0.032 on row count alone, so a row mismatch is not a detail here, it
# is the single variable already known to move the metric most.
#
# This config therefore mirrors `configs/crosscoder_stage0.yaml` EXACTLY --
# same corpus, same context_len, same layer, same seed, same batch size -- and
# changes only the second model: TimesFM's random-init twin in place of
# Chronos-T5-Base. Same corpus + same context_len => the same 3313 admitted
# series x 14 windows = 46382 rows, which is the equality the ladder checks.
#
# The real TimesFM is captured here too, though L-B reads only the twin. It
# costs one extra forward pass over a corpus this run is already loading and it
# buys a bit-exactness control: this store's `TimesFM/stacked_xf.4` must equal
# `runs/crosscoder_stage0_bigdata`'s array element for element. If it does not,
# the two stores are not the comparable populations this whole file assumes,
# which is exactly the class of silent drift `CLAUDE.md` §11.24 cost a session.
#
# `sanity_check` at context_len 448 reads 1.00 at every TimesFM layer and is
# unaffected by §11.26's Chronos-tokenizer amplitude finding -- there is no
# Chronos in this run.
#
# Only `extract` is enabled: this run exists to write activations.zarr. Nothing
# here is an analysis, and pairing a model against its own untrained twin would
# make most of the analysis stages meaningless anyway.

run:
  name: crosscoder_stage0_null
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../../tsfm_benchmark/benchmark_out_full1/public_dev  # relative to tsfm_lens/
  context_len: 448
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    layer_regex: '^stacked_xf\.4$'   # the real run's layer_a, for the bit-exactness control
    capture_layer_stride: 1
  - name: TimesFM-random
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch  # architecture only -- weights never loaded
    random_init: true
    batch_size: 32
    layer_regex: '^stacked_xf\.4$'   # the same layer: L-B holds depth fixed and varies training
    capture_layer_stride: 1

l0: {enabled: false}
l1: {enabled: false}
l2: {enabled: false}
l3: {enabled: false}
lens: {enabled: false}
attention: {enabled: false}
internals: {enabled: false}
clustering: {enabled: false}
exemplars: {enabled: false}
confirm: {enabled: false}
layer_screen: {enabled: false}
budget: {enabled: false}
sae: {enabled: false}
report: {enabled: false}
