# ROADMAP.md §6.2.1 Stage 0 — the winning crosscoder configuration.
#
# Stage 0's fourth exit criterion is that the winner is "written into a
# committed config file, not left as a CLI incantation in a session log".
# This is that file. It is consumed by `run_crosscoder_stage0.py --params
# configs/crosscoder_stage0_winner.yaml`, which builds a one-row sweep from
# it, so the recorded result below is regenerable by a command that reads
# these exact numbers rather than by retyping them.
#
# Provenance: `--grid k` over the store built by `configs/crosscoder_stage0.yaml`
# (46382 aligned rows). Full sweep table and the reasoning for every choice
# are in ROADMAP.md §6.2.1's "Stage 0 k sweep" Findings block; the short
# version of each knob is inline below.

# The activation store this was measured against. Relative to tsfm_lens/,
# matching every other config in this directory (CLAUDE.md invariant 11).
run: runs/crosscoder_stage0_bigdata

# The L1 peak-CKA layer pair. Not a free choice: it is where the cross-model
# geometry is strongest, which is the only place a joint dictionary has a
# reason to exist.
layer_a: stacked_xf.4        # TimesFM-2.5-200M
layer_b: encoder.block.10    # Chronos-T5-Base

# Measured effective dimensionality of each layer above, from
# runs/medium_run_chronos_base/internals/profile.json. Recorded because `k`
# below is chosen against these numbers, not against hidden width.
eff_dims: [28.15, 13.93]

train:
  # 1280 atoms = ~45x TimesFM's effective dimensionality. Larger dictionaries
  # do not buy more living atoms (H2 was refuted: 51/61/68 alive at
  # 112/448/1120), so this is sized for headroom, not for capacity.
  dict_size: 1280

  # The decisive knob. k=16 starved reconstruction below TimesFM's ~28
  # effective dimensions and left 65% of atoms dead; k=48 clears all three
  # numeric criteria at once. k=64 also passes but is strictly worse on every
  # axis (fidelity down, dead rate 13x up, features less sparse), so the
  # optimum is interior and this is the *smallest* passing k, deliberately —
  # a higher L0 is a weaker interpretability claim.
  k: 48

  epochs: 60

  # AuxK (the OpenAI-style dead-latent auxiliary loss, sae/models.py). Off by
  # default everywhere else in the repo so prior numbers stay regenerable;
  # on here because it is what made the gate reachable at all — at fixed
  # everything else it moved the dictionary from 80 alive atoms to 835.
  aux_k: 64
  aux_coef: 0.03125
  aux_dead_steps: 20

  # 0 = derive as epochs // 5, matching the feasibility run's setting.
  # Resampling alone never fixed deadness (H3), but it is left on because
  # every recorded number was produced with it.
  resample_every: 0

seed: 0

# The measured result of exactly this configuration, at full precision.
# Kept in the config so a rerun can be diffed against it without opening a
# JSON — if these stop reproducing, something upstream changed (CLAUDE.md
# §11.24's lesson about shared-infrastructure fixes silently rewriting an
# experiment's meaning).
expected:
  crosscoder:
    fidelity_a: 0.7588510627220952   # TimesFM
    fidelity_b: 0.7556082781475381   # Chronos-T5-Base
    dead_feature_rate: 0.020312499999999956
    n_alive: 1254
    l0_actual: 48.0
  # Stage 0's criteria also apply to the matched per-model baselines. The
  # TimesFM one passes outright; the Chronos one fails on dead rate alone
  # (0.550 vs. the 0.30 bar) at every k tried.
  #
  # Correction (2026-08-13): the sentence that used to end the line above —
  # "which is why Stage 0's checkbox is still open" — is stale. It is not,
  # and the numbers here are unchanged and still correct: the baseline
  # failure was an artifact of scoring both baselines at the *crosscoder's*
  # dictionary size. Under per-model sizing (finding (16)'s DECISION) both
  # baselines pass, and Stage 0 is cleared by
  # `crosscoder_stage0_gate.yaml` at 5 of 5 seeds. This file remains the
  # k sweep's winner under matched sizing, which is a control rather than a
  # superseded result — `--baseline-dict-sizes` unset still reproduces it.
  baseline_a_passes: true
  baseline_b_passes: false
