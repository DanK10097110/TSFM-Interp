# Release workflow: runs only when a tag matching v* is pushed
# (docs/RELEASING.md). Builds the sdist and wheel of both packages
# (tsfm-benchmark from the repo root, tsfm-lens from tsfm_lens/), publishes
# them to PyPI through Trusted Publishing (no API token stored anywhere), and
# attaches the same files to a GitHub Release.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Check the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in pyproject.toml tsfm_lens/pyproject.toml; do
            v=$(python -c "import tomllib; print(tomllib.load(open('$f','rb'))['project']['version'])")
            if [ "$v" != "$tag" ]; then
              echo "::error::tag v$tag does not match $f version $v"
              exit 1
            fi
          done
      - name: Build tsfm-benchmark
        run: python -m build --outdir dist .
      - name: Build tsfm-lens
        run: python -m build --outdir dist tsfm_lens
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
