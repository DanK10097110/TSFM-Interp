# Phase 2c (ROADMAP.md §6.3) follow-up: a second negative control, to start
# isolating "shared pretraining lineage" from "architecture match alone."
#
# The existing negative control (Chronos-T5-Base vs TimesFM, already on
# record from medium_run_chronos_base) is cross-architecture, while the
# positive pair (configs/distill_positive_chronos_small_base.yaml,
# Chronos-T5-Small vs Chronos-T5-Base) is same-architecture -- so the large
# gap already measured between them could reflect "architecture match" as
# much as "shared lineage." This config pairs Chronos-T5-Small and
# Chronos-T5-Base **with random_init: true on both sides** -- same
# architecture family, same tokenizer/config metadata, but zero shared
# initialization and zero training of any kind. If this same-architecture,
# zero-training pair's L1/L2 signal comes back far below the trained
# positive pair's (0.734 CKA / 0.637 L2 gain), that's evidence the positive
# pair's large signal is not explained by architecture match alone -- it is
# NOT, by itself, proof of *lineage specifically* (a real independently-
# trained same-architecture checkpoint would still be the cleaner test, and
# none is known to exist for Chronos-T5) but it is a real, cheap, honest
# additional data point using the already-implemented ModelConfig.random_init
# mechanism (CLAUDE.md §6.2) -- no new code needed, per CLAUDE.md §2.2.
#
# Same corpus/context/horizon/seed as distill_positive_chronos_small_base.yaml
# and medium_run_chronos_base.yaml so all three runs' L1/L2 numbers are
# directly comparable. Deliberately lean, same stage selection as the
# positive-pair config: l0/l1/l2/internals/report only.

run:
  name: distill_negative_random_architecture
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../benchmark_medium/public_dev  # relative to tsfm_lens/ (where run.py is invoked from)
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: Chronos-T5-Small-random
    adapter: chronos
    checkpoint: amazon/chronos-t5-small  # architecture + tokenizer only -- weights never loaded
    random_init: true
    batch_size: 32
    capture_layer_stride: 1       # 6 encoder blocks
  - name: Chronos-T5-Base-random
    adapter: chronos
    checkpoint: amazon/chronos-t5-base  # architecture + tokenizer only -- weights never loaded
    random_init: true
    batch_size: 24
    capture_layer_stride: 1       # 12 encoder blocks

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15
  rsa: true
  rsa_max_series: 300

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 15000
  input_baseline: true

l3:
  enabled: false

lens:
  enabled: false

attention:
  enabled: false

exemplars:
  enabled: false

clustering:
  enabled: false

layer_screen:
  enabled: false

sae:
  enabled: false

report:
  enabled: true
  title: "Phase 2c negative control 2: Chronos-T5-Small-random vs Chronos-T5-Base-random (architecture match, zero training)"

stats:
  enabled: true
  n_boot: 500
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50

confirm:
  enabled: false
