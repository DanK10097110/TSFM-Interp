# The Chronos-T5 scaling ladder (ROADMAP.md §20 H1).
#
# Five checkpoints sharing an architecture, a training corpus and a tokenizer,
# differing only in size. Everything else in this file is held fixed across all
# five rungs -- corpus, context/horizon, alignment window, reference model,
# every stage knob -- so the only variable on the ladder axis is the Chronos
# checkpoint. §5.3 already ran two of these points as a size *control* and found
# L1/L2 growing with size while L4 clustering AMI shrank; five points turn that
# into a curve.
#
# THIS FILE IS NOT RUNNABLE BY run.py DIRECTLY. The `ladder:` block below is not
# part of the pipeline's config schema; it names the rungs. Expand it into five
# ordinary, individually-runnable configs (one run directory each -- cleaner
# than five model blocks, given VRAM) with `run_scaling_ladder.py` (study
# driver, dev branch only -- not present on `main`; this config and the
# already-expanded configs/_ladder/*.yaml it produced are kept on `main`
# only as test fixtures, see configs/README.md):
#
#   python run_scaling_ladder.py --config configs/scaling_ladder_chronos.yaml \
#       --emit-configs configs/_ladder
#
# which also prints the exact per-rung `run.py` commands, in the order to run
# them (cheapest first, so a failure surfaces before the expensive rung). Per
# CLAUDE.md §2.8 those five extractions are background work. Then reduce them:
#
#   python run_scaling_ladder.py --runs runs/ladder_tiny,...,runs/ladder_large \
#       --model Chronos --out runs/ladder/scaling_ladder.json
#
# Two deliberate exclusions, both cost/correctness rather than oversight:
#   * `confirm` is OFF. The private corpus is a consumable (CLAUDE.md §6.7) and
#     a five-rung sweep would spend it five times over for one ladder.
#   * `sae.targets` is left empty (= `layer_screen`'s selection). A pinned layer
#     name cannot be held fixed across models of different depths, so the
#     constant across rungs is the *selection policy*, not the layer -- which is
#     itself a confound on the SAE columns, and is stated in the reducer's
#     output rather than hidden.

ladder:
  model: Chronos                  # the model whose size varies; must match `models[*].name`
  reference: TimesFM              # held fixed at every rung; L1/L2/L4 are measured against it
  rungs:                          # ordered cheapest-first; `batch_size` shrinks as size grows
    - {label: tiny,  checkpoint: amazon/chronos-t5-tiny,  batch_size: 48}
    - {label: mini,  checkpoint: amazon/chronos-t5-mini,  batch_size: 48}
    - {label: small, checkpoint: amazon/chronos-t5-small, batch_size: 32}
    - {label: base,  checkpoint: amazon/chronos-t5-base,  batch_size: 24}
    - {label: large, checkpoint: amazon/chronos-t5-large, batch_size: 8}

run:
  name: ladder                    # `--emit-configs` appends `_<label>` per rung
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../benchmark_medium/public_dev   # relative to tsfm_lens/
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 1       # stride 1: the ladder compares depth-located claims across
                                  # rungs, and F4 measured stride 2 as a 42.5% coverage loss
  - name: Chronos
    adapter: chronos
    checkpoint: amazon/chronos-t5-small   # OVERWRITTEN per rung by --emit-configs
    batch_size: 32                        # OVERWRITTEN per rung by --emit-configs
    capture_layer_stride: 1
    kwargs:
      num_samples: 20

budget:
  enabled: true                   # REQUIRED: the ladder axis is this stage's measured
                                  # parameter count, never a checkpoint name (§11.34)

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]
  calibration: true

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50

lens:
  enabled: true
  layer_stride: 1
  max_series: 8                   # must be <= every rung's batch_size (large is 8)
  tuned: true
  tuned_max_series: 300
  val_frac: 0.25
  lambdas: [0.001, 0.01, 0.1, 1.0]
  crystallization_tol: 0.1

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15
  rsa: true
  rsa_max_series: 300

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 15000
  input_baseline: true

clustering:
  enabled: true
  layer: auto
  k: auto
  pca_dim: 50
  max_series: 300
  use_umap: true

layer_screen:
  enabled: true
  method: work_bend
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: true
  targets: []                     # auto -- see the header note on why this is a stated confound
  dict_size_mult: 8
  k: 32
  lr: 0.001
  epochs: 60
  batch_size: 4096
  resample_dead_every_epochs: 5
  forecast_preservation_max_series: 8   # must be <= every rung's batch_size
  ground_truth_max_series: 2000
  real_data_enabled: false        # off across the ladder: 5x the HF pull buys no ladder metric

l3:
  enabled: false                  # no H1 metric comes from L3; the most expensive stage to run 5x
attention:
  enabled: false                  # ditto -- and TimesFM's lag axis is fixed across rungs anyway
exemplars:
  enabled: false
confirm:
  enabled: false                  # the private corpus is a consumable -- see the header note

stats:
  enabled: true
  n_boot: 500
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

report:
  enabled: true
  title: Chronos-T5 scaling ladder rung
