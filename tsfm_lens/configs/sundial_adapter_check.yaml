# Phase 4 (ROADMAP.md §9) adapter-development scratch config for
# Sundial -- used only for `--discover-layers`/`--check-alignment` while
# building `models/sundial_adapter.py`, per CLAUDE.md §6.2's "Adding a
# model" workflow. Not a real comparison run.

run:
  name: sundial_adapter_check
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0

data:
  source: smoke
  context_len: 512
  horizon: 64
  smoke_series_per_family: 8

alignment:
  window: 32
  sanity_check: false

models:
  - name: Sundial
    adapter: sundial
    checkpoint: thuml/sundial-base-128m
    batch_size: 16
    capture_layer_stride: 1
