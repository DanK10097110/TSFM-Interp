# TimesFM vs Chronos on a sealed tsfm_benchmark corpus.
# Every stage can be disabled (enabled: false) or tuned independently;
# the report renders whichever sections have artifacts.

run:
  name: timesfm_vs_chronos
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false     # true if both models + headroom fit in VRAM

data:
  source: sealed                # sealed | jsonl | smoke
  # Relative to tsfm_lens/ (where run.py is invoked from), like every other
  # path: field in this file -- an absolute placeholder here was itself a
  # violation of CLAUDE.md invariant 11 (ROADMAP.md sec 15 A18). Point this
  # at a real sealed public_dev directory (corpus.jsonl + manifest), e.g.
  # ../benchmark_full/public_dev.
  path: ../benchmark_full/public_dev
  context_len: 512              # multiple of alignment.window; <= chronos-t5 context (512)
  horizon: 64
  family_key: auto              # or an explicit metadata path, e.g. provenance.generator

alignment:
  window: 32                    # = TimesFM input_patch_len so patches map 1:1 to windows
  sanity_check: true            # impulse check at extraction; cheap, catches span drift

models:
  - name: timesfm
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 64
    capture_layer_stride: 2     # 20 layers -> 10 capture points
    # No kwargs needed: the timesfm adapter targets the installed package's
    # 2.5-only API (it dropped the old Hparams/Checkpoint class API, with no
    # Python>=3.12-compatible release that keeps it), which fixes patch size
    # (32) and layer count (20) from the checkpoint itself.
  - name: chronos
    adapter: chronos
    checkpoint: amazon/chronos-t5-base
    batch_size: 64
    capture_layer_stride: 1     # 12 encoder blocks
    kwargs:
      num_samples: 20
  # Chronos-Bolt alternative (patch-based T5 encoder, deterministic quantile
  # head). Swap in for the chronos entry; run --check-alignment first.
  # - name: chronos_bolt
  #   adapter: chronos_bolt
  #   checkpoint: amazon/chronos-bolt-small
  #   layer_regex: 'encoder\.block\.\d+$'
  #   capture_layer_stride: 1
  #   batch_size: 64

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: true
  layer_stride: 2
  max_rows: 100000
  family_conditioned: true
  min_family_series: 15
  rsa: true
  rsa_max_series: 600

l2:
  enabled: true
  layer_stride: 3
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 60000
  input_baseline: true

l3:
  enabled: true
  max_series: 384
  corruptions:
    noise: {snr_db: 6.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    frequency_shift: {factor: 2.0}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 3, scale: 6.0}
    smooth: {kernel: 9}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: true
    layer_stride: 3
    corruptions: [deseasonalize, noise, level_shift, spike]
    max_series: 48              # must be <= every model's batch_size
    num_samples: 8
    per_window: true            # layer x window restoration heatmaps
    window_stride: 2            # every window doubles patching cost; stride 2 halves it

# Forecast lens: per-layer forecasts decoded with the model's own head
# (skip lens) plus a ridge readout from stored window states (tuned lens).
# Skip lens runs one forward per layer on a single batch, so max_series must
# be <= every model's batch_size.
lens:
  enabled: true
  layer_stride: 1
  max_series: 48
  tuned: true
  tuned_max_series: 2000
  val_frac: 0.25
  lambdas: [0.001, 0.01, 0.1, 1.0]
  crystallization_tol: 0.1      # "crystallized" = within 10% of final MASE

# Attention structure and head/MLP causality. Pattern capture holds
# [batch, heads, T, T] per layer in memory: for chronos-t5 at T=512 that is
# ~2.4 GB at batch_series 16 — lower batch_series before lowering max_series.
# TimesFM's attention is fused SDPA with no exposed weights by default, but
# its adapter recovers them by temporarily swapping in the library's own
# unfused dot-product math (see models/timesfm_adapter.py's
# attention_patterns) — confirmed live against google/timesfm-2.5-200m-pytorch
# 2026-08-03. Both models also still get head/MLP ablation through their
# discovered output projections.
attention:
  enabled: true
  patterns: true
  max_series: 128
  batch_series: 16
  max_lag_tokens: 256
  ablation: true
  ablation_max_series: 48       # must be <= every model's batch_size
  head_layer_stride: 2          # ablation cost = blocks/stride x heads forwards
  top_k: 5
  # Which lag resolution a CROSS-MODEL attention claim may cite. A lag index
  # means ~32 timesteps for TimesFM and ~1 for Chronos-T5, so reading the two
  # models' native lag profiles index-for-index makes patch size look like a
  # finding. `matched` bins every model's lag axis to the coarsest configured
  # model's token width first. Both are ALWAYS computed and recorded
  # (`head_scores` vs `head_scores_matched`); this only selects which one the
  # report's cross-model claim reads, so no recorded number depends on it.
  resolution_mode: matched

# Exemplar case studies: per-family series picked from the L0 MASE-gap
# distribution, with forecasts, per-series lens curves, and attention maps.
exemplars:
  enabled: true
  per_family: 2
  max_families: 6

clustering:
  enabled: true
  layer: auto                   # auto = each model's side of the L1 peak-CKA pair
  k: auto                       # auto = number of benchmark families (clipped 2..20)
  pca_dim: 50
  max_series: 5000
  use_umap: true

# Layer screening (ROADMAP.md §6.1.1): a cheap pre-screen over every one of
# each model's own captured layers, run before every expensive stage above.
# `sae.targets: []` below ("auto") trains one SAE per layer this selects,
# instead of the old arbitrary "final captured layer" default. work_bend
# (Idea A) is the current bake-off winner (2026-08-05, one corpus/checkpoint
# pair) -- coverage and factor_emergence remain available for re-testing.
layer_screen:
  enabled: true
  method: work_bend             # work_bend | coverage | factor_emergence
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: false                # baseline TopKSAE exists (sae/train.py); off here for cost --
                                 # enable + leave targets: [] to train on layer_screen's picks
  # Evidence given to the LLM narrator (run_sae_describe.py, ROADMAP.md
  # sec 26 C/G). true also hands it what each feature's OWN top-firing series
  # measure, against the corpus median -- which is what tells apart features
  # sharing a target and a structural field, of which this repo's own runs
  # have 25 groups. Structural fields only: a contrast on a PROVENANCE field
  # would report how the benchmark was built (sec 26 A1). Free -- a pure
  # reduction over artifacts the exemplar pass already loads, no extra
  # forward pass and no extra model load. `false` reproduces the
  # pre-2026-09-04 packets exactly. Read by the narrator SCRIPT, never by
  # the `sae` stage, so it is excluded from that stage's config fingerprint
  # (CLAUDE.md sec 11.51) and changing it never invalidates a trained SAE.
  describe_from_exemplars: true

report:
  enabled: true
  # Model identity in the report (chips, H1, section text) always comes from
  # the `models[*].name` entries above, never from this string — swap models
  # or rename them freely and the report stays correct without touching this.
  title: Layered comparison

# ---------------------------------------------------------------------------
# Statistics: series-level bootstrap CIs everywhere, paired tests with Holm
# correction for family comparisons. Costs extra compute at analysis time
# only (never at extraction).
stats:
  enabled: true
  n_boot: 500          # resamples for cheap statistics (means, paired tests)
  n_boot_heavy: 200    # cap for expensive statistics (CKA, stitching gain)
  ci: 0.95
  alpha: 0.05
  min_series: 8        # families below this are reported as untestable

# Per-model depth profiles: effective dimensionality, family-probe
# decodability, and CKA-to-input per layer.
internals:
  enabled: true
  layer_stride: 1
  max_rows: 40000
  probe_pca_dim: 50

# One-shot confirmation on a sealed PRIVATE corpus. Discipline: enable this
# only for the final run, after all exploration on the dev corpus is frozen.
# The stage refuses to overwrite existing confirmation artifacts, and the
# private epoch should be regenerated (tsfm_benchmark) if it is ever reused.
confirm:
  enabled: false
  source: sealed
  # Relative to tsfm_lens/ (where run.py is invoked from), matching every
  # other path: field in this file (CLAUDE.md invariant 11) -- an absolute
  # placeholder here was itself a violation of that invariant (ROADMAP.md
  # sec 15 A18). Point this at your own sealed private epoch, e.g. one
  # produced by tsfm_benchmark/example_runs/run_full.py.
  path: ../benchmark_full/private_test
  max_series: 1024
  require_seal: true   # refuse to run without tsfm_benchmark seal verification
  alpha: 0.05
