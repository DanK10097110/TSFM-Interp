# ROADMAP.md sec 25.9 Stage 0 / sec 25.20(e): train the CURRENT PRODUCTION sae
# recipe at the seven (model, layer) targets from the three-model flagship
# panel (full_report_run_large's layer_screen selection) that were NOT
# already covered by runs/sae_revival (which only trained the two-model
# pair's pinned targets, TimesFM stacked_xf.18 and Chronos-T5-Base
# encoder.block.6). Chronos-2's three targets are excluded on purpose --
# sec 25.8's gate table already shows Chronos-2 passes the alive-dictionary
# gate under the PRODUCTION recipe with no intervention (0.78-1.24% dead),
# so there is no revival question to ask for that model.
#
# This is configs/full_report_run_large.yaml verbatim (data/models/every
# analysis stage unchanged, so every already-computed artifact's config
# fingerprint matches and every prior stage self-skips) except:
#   run.name          -> sae_stage0_panel (new run dir; run directory itself
#                         is a copy of runs/full_report_run_large's already-
#                         extracted store, per sec 15 A3 -- never rerun into
#                         an existing run dir under an edited config).
#   sae.targets        -> pinned to exactly the 7 uncovered targets (was []
#                         "auto"), so this run does not waste GPU retraining
#                         Chronos-2 or duplicate the two already-covered
#                         two-model-pair targets.
#   sae: block          otherwise UNCHANGED from full_report_run_large.yaml
#                         (dict_size_mult 8, k 32, aux_k 0, dict_size_policy
#                         mult, min_train_steps 0) -- this IS "the current
#                         production recipe" by definition; nothing here is
#                         new tuning.
#   (confirm is left UNCHANGED/enabled -- see the confirm: block's own
#   comment below. An attempt to turn it off tripped sec 15 A3's stale-
#   artifact guard, correctly: --stages sae,report never selects confirm,
#   so its existing full_report_run_large artifacts are reused untouched
#   either way, and the config must say so rather than disagree with disk.)
#
# Cost: cached-activation training only, no re-extraction (sec 25.9's own
# stated cost bound) -- the run directory this config points at already has
# activations.zarr, l0-l3, internals, lens, attention, budget, clustering,
# exemplars, layer_screen all computed and will self-skip via sec 15 A3's
# fingerprint check.

run:
  name: sae_stage0_panel
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../benchmark_large/public_dev
  context_len: 512
  horizon: 64
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 2
  - name: Chronos-T5-Base
    adapter: chronos
    checkpoint: amazon/chronos-t5-base
    batch_size: 24
    capture_layer_stride: 1
  - name: Chronos-2
    adapter: chronos2
    checkpoint: amazon/chronos-2
    batch_size: 24
    capture_layer_stride: 1

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]
  calibration: true

l1:
  enabled: true
  layer_stride: 1
  max_rows: 20000
  family_conditioned: true
  min_family_series: 15
  rsa: true
  rsa_max_series: 800

l2:
  enabled: true
  layer_stride: 1
  lambdas: [0.001, 0.01, 0.1, 1.0]
  val_frac: 0.25
  max_rows: 40000
  input_baseline: true

l3:
  enabled: true
  max_series: 800
  corruptions:
    noise: {snr_db: 0.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    frequency_shift: {factor: 2.0}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 8, scale: 10.0}
    smooth: {kernel: 9}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: true
    layer_stride: 2
    corruptions: [deseasonalize, noise, level_shift, spike, warp, dropout]
    max_series: 24
    per_window: true
    window_stride: 1

lens:
  enabled: true
  layer_stride: 1
  max_series: 24
  tuned: true
  tuned_max_series: 800
  val_frac: 0.25
  lambdas: [0.001, 0.01, 0.1, 1.0]
  crystallization_tol: 0.1

attention:
  enabled: true
  patterns: true
  max_series: 400
  batch_series: 16
  max_lag_tokens: 128
  ablation: true
  ablation_max_series: 24
  head_layer_stride: 1
  top_k: 5

exemplars:
  enabled: true
  per_family: 3
  max_families: 3

clustering:
  enabled: true
  layer: auto
  k: auto
  pca_dim: 50
  max_series: 800
  use_umap: true

layer_screen:
  enabled: true
  method: work_bend
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: true
  targets:                        # the 7 flagship-panel targets NOT already
                                   # covered by runs/sae_revival's two-model
                                   # pinned pair (TimesFM stacked_xf.18,
                                   # Chronos-T5-Base encoder.block.6).
                                   #
                                   # CORRECTED after a live crash (CLAUDE.md
                                   # sec 11.40): layer_screen's real selection
                                   # for TimesFM is {.2, .6, .9, .15, .18},
                                   # and this store (capture_layer_stride: 2)
                                   # only captured EVEN layers -- .9 and .15
                                   # were never extracted. Verified via the
                                   # pipeline's own sae/train.py::
                                   # _default_targets against
                                   # runs/full_report_run_large's real store:
                                   # it substitutes the best-scoring CAPTURED
                                   # layer from the screen's own ranking for
                                   # each missing pick -- .9 -> .10
                                   # (score 1.5281, next best after .9's
                                   # 1.5688) and .15 -> .16 (score 0.3951,
                                   # next best after .15's 0.6141). So the
                                   # targets below are stacked_xf.{2,6,10,16}
                                   # (NOT the originally-planned .15), which
                                   # is exactly what an unpinned
                                   # sae.targets: [] "auto" run would have
                                   # resolved to for this model.
    - model: TimesFM
      layer: stacked_xf.2
    - model: TimesFM
      layer: stacked_xf.6
    - model: TimesFM
      layer: stacked_xf.10
    - model: TimesFM
      layer: stacked_xf.16
    - model: Chronos-T5-Base
      layer: encoder.block.4
    - model: Chronos-T5-Base
      layer: encoder.block.8
    - model: Chronos-T5-Base
      layer: encoder.block.10
  dict_size_mult: 8                # PRODUCTION recipe: unchanged from
  k: 32                            # full_report_run_large.yaml.
  lr: 0.001
  epochs: 60
  batch_size: 4096
  resample_dead_every_epochs: 5
  forecast_preservation_max_series: 24
  ground_truth_max_series: 2000
  persist_features: true
  real_data_enabled: true
  real_data_source: "Monash-University/monash_tsf"
  real_data_n_windows: 4000
  real_data_pool_limit: 500

report:
  enabled: true
  verbose: true
  verbose_series: 2
  title: SAE Stage 0 panel A/B -- production recipe, 7 uncovered targets

stats:
  enabled: true
  n_boot: 2000
  n_boot_heavy: 200
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 40000
  probe_pca_dim: 50
  probe_max_iter: 2000

confirm:
  enabled: true                   # UNCHANGED from full_report_run_large.yaml.
                                   # Left on, not for confirm's own sake --
                                   # sec 15 A3's stale-artifact guard refuses
                                   # a config edit that would leave already-
                                   # computed confirm/ artifacts stale
                                   # (confirmed live: it fired on `enabled:
                                   # false` here). We are not selecting the
                                   # confirm stage anyway (--stages
                                   # sae,report), so its existing artifacts
                                   # from full_report_run_large are simply
                                   # reused unchanged, not re-spent.
  source: sealed
  path: ../benchmark_large/private_test
  max_series: 800
  require_seal: true
  alpha: 0.05
