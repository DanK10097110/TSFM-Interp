# Curated example (identical to configs/generic_hf_timer.yaml -- kept here too
# as the canonical worked example for the zero-code `generic_hf` adapter
# path, one per hand-written/zero-code adapter family in configs/examples/).
#
# The zero-code path, end to end (ROADMAP.md sec 16 E3(b)).
#
# `Timer` below has NO hand-written adapter in this repo. Everything an
# adapter normally declares -- which forward kwarg carries the series, which
# modules are the block stack, what time interval each token covers, where the
# forecast comes out -- is probed by `GenericHFAdapter` and recorded in the run
# log; `python run.py --config configs/generic_hf_timer.yaml --probe-adapter
# Timer` prints the resolved table without running anything else.
#
# It is paired against hand-written Chronos-T5-Small so the run exercises the
# cross-model stages (L1/L2/L3 agreement), which is the actual claim under
# test: a checkpoint added with zero code reaches the same analyses as one
# added with an adapter file.
#
# Two things about Timer that are measured here, not assumed:
#   * its 96-timestep patch tokens are DISCOVERED, not read from its config --
#     span discovery returns exactly [0,96) [96,192) ... [384,480).
#   * its head is point-only, so its quantiles are degenerate. L0's
#     calibration numbers for Timer are unmeasured, not perfect; the adapter
#     logs a WARNING saying so on every predict().
# context_len 480 = 5 x Timer's 96-step patch = 5 x alignment.window, and
# is under chronos-t5's 512 limit.

run:
  name: generic_hf_timer_example   # distinct from configs/generic_hf_timer.yaml's own run name
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 0
  keep_models_loaded: false

data:
  source: sealed
  path: ../benchmark_medium/public_dev   # relative to tsfm_lens/
  context_len: 480
  horizon: 64
  family_key: auto
  max_series: 120                 # deliberately small: this run is a path test

alignment:
  # 96, not the usual 32, because Timer's tokens are 96 timesteps wide.
  #
  # HISTORY, because it matters for how to read this: at window 32 this run
  # FAILED the alignment gate at 0.33 against a 0.5 threshold -- for a token
  # map that is provably correct (token-level argmax is a perfect diagonal
  # with exactly 0.000 leakage). Three consecutive 32-step windows read the
  # same 96-step token, receive identical pooled activations, and the impulse
  # check's argmax tie-breaks to the first of each triple: a hard arithmetic
  # ceiling of 1/3, which Timer was sitting exactly on. That was a defect in
  # the GATE, now fixed -- `resolvable_hit_ceiling` computes the ceiling and
  # the gate is applied to hits/ceiling (CLAUDE.md sec 11.35), so window 32
  # would pass today.
  #
  # 96 is kept anyway, for the reason that survives the fix: at window 32 the
  # analysis carries 15 windows holding only 5 tokens' worth of information,
  # so every cross-model matrix downstream is 3x redundant along its window
  # axis for this model. The window should be the coarsest model's token
  # width -- the same rule that made 32 right for TimesFM (CLAUDE.md sec 6.3).
  #
  # Consequence for comparison: every number from this run is on a 96-step
  # window. Window-level counts and depth coordinates are NOT comparable to
  # runs measured at window 32.
  window: 96
  sanity_check: true

models:
  - name: Timer
    adapter: generic_hf           # <- no adapter file exists for this checkpoint
    checkpoint: thuml/timer-base-84m
    batch_size: 16
    capture_layer_stride: 1       # 8 blocks
    kwargs:
      # AutoModel resolves to Timer's bare backbone, which has no forecast
      # head at all. Naming the class is a config line, not adapter code.
      auto_class: AutoModelForCausalLM
  - name: Chronos-T5-Small
    adapter: chronos
    checkpoint: amazon/chronos-t5-small
    batch_size: 16
    capture_layer_stride: 1

l0: {enabled: true, quantiles: [0.1, 0.5, 0.9]}
budget: {enabled: true}
layer_screen: {enabled: true, method: work_bend, budget_frac: 0.25, min_budget: 2}
internals: {enabled: true, layer_stride: 1, max_rows: 8000, probe_pca_dim: 50}
lens:
  enabled: true
  layer_stride: 1
  max_series: 16                  # must be <= every model's batch_size
  tuned: true
  tuned_max_series: 120
  val_frac: 0.25
  crystallization_tol: 0.1
l1: {enabled: true, layer_stride: 1, max_rows: 8000, family_conditioned: true, rsa: true, rsa_max_series: 120}
l2: {enabled: true, layer_stride: 1, val_frac: 0.25, max_rows: 6000, input_baseline: true}
l3:
  enabled: true
  max_series: 120
  corruptions:
    noise: {snr_db: 6.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 3, scale: 6.0}
  patching:
    enabled: true
    layer_stride: 2
    corruptions: [deseasonalize, noise]
    max_series: 16                # must be <= every model's batch_size
    per_window: true
    window_stride: 2
attention: {enabled: true, patterns: true, max_series: 60, batch_series: 8, max_lag_tokens: 64, ablation: true, ablation_max_series: 16, head_layer_stride: 1, top_k: 5}
clustering: {enabled: true, layer: auto, k: auto, pca_dim: 50, max_series: 120, use_umap: true}
exemplars: {enabled: true, per_family: 2, max_families: 3}
sae: {enabled: false}
confirm: {enabled: false}
stats: {enabled: true, n_boot: 300, n_boot_heavy: 150, ci: 0.95, alpha: 0.05, min_series: 8}
report:
  enabled: true
  title: Zero-code path · Timer (generic_hf, no adapter) vs Chronos-T5-Small
