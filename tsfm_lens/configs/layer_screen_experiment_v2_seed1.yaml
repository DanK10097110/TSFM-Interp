# Layer-screening bake-off experiment, v2 (ROADMAP.md §6.1.1 / §6.1.1-E,
# third-architecture-family extension).
#
# Same experiment as configs/layer_screen_experiment.yaml (TimesFM +
# Chronos-T5-Small, both at capture_layer_stride: 1 for a fair all-layers
# comparison), with a third model added: Sundial (thuml/sundial-base-128m,
# decoder-only backbone + flow-matching head -- a third, structurally
# distinct architecture family next to TimesFM's patch-based deterministic
# decoder-only design and Chronos-T5's per-timestep-tokenized
# encoder-decoder). Sundial has only 12 layers, so stride 1 (all layers) is
# cheap. batch_size: 16 for Sundial mirrors configs/sundial_phase4_check.yaml
# (the only other real-checkpoint config exercising this adapter).
#
# Stage set, corpus, and every other knob are unchanged from the original
# bake-off config: extract, l0 (forecasts), internals (eff-dim/probe
# cross-check), l3 sensitivity-only (second gold signal, no per-window
# patching) -- lens, attention, clustering, sae, confirm, l1, l2 all off.
# run_layer_screen_bakeoff.py iterates "for model in store.models()", so a
# 3-model run should produce all three models' selector scores from one
# invocation -- see ROADMAP.md §6.1.1's third-architecture Findings for
# whether that held in practice.

run:
  name: layer_screen_experiment_v2_seed1
  out_dir: runs
  device: cuda
  dtype: bfloat16
  seed: 1
  keep_models_loaded: false

data:
  source: sealed
  path: ../benchmark_medium/public_dev  # relative to tsfm_lens/ (where run.py is invoked from)
  context_len: 512
  horizon: 64
  max_series: 220
  family_key: auto

alignment:
  window: 32
  sanity_check: true

models:
  - name: TimesFM
    adapter: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    batch_size: 32
    capture_layer_stride: 1      # ALL 20 layers -- see header note
  - name: Chronos-T5-Small
    adapter: chronos
    checkpoint: amazon/chronos-t5-small
    batch_size: 32
    capture_layer_stride: 1      # 6 encoder blocks, already all of them
  - name: Sundial
    adapter: sundial
    checkpoint: thuml/sundial-base-128m
    batch_size: 16
    capture_layer_stride: 1      # 12 layers, all of them

l0:
  enabled: true
  quantiles: [0.1, 0.5, 0.9]

l1:
  enabled: false

l2:
  enabled: false

l3:
  enabled: true
  max_series: 220
  corruptions:
    noise: {snr_db: 6.0}
    detrend: {}
    deseasonalize: {top_k: 2}
    level_shift: {position_frac: 0.6, scale: 3.0}
    spike: {count: 3, scale: 6.0}
    warp: {strength: 0.15}
    dropout: {frac: 0.15, n_blocks: 3}
  patching:
    enabled: false  # per-window patching is expensive and not needed here; sensitivity
                     # fingerprints alone give §6.1.1-E's secondary gold signal.

lens:
  enabled: false

attention:
  enabled: false

exemplars:
  enabled: false

clustering:
  enabled: false

# The pipeline's own default layer_screen stage (ROADMAP.md §6.1.1, now
# wired in ahead of `sae` in every config) runs the bake-off winner
# (work_bend) as a cheap sanity artifact here too -- independent of, and far
# cheaper than, run_layer_screen_bakeoff.py's full three-selector-vs-SAE-gold
# comparison below, which remains the actual experiment this config exists
# for. Only relevant if `layer_screen` is included in `--stages` explicitly;
# the documented `--stages extract,l0,internals,l3` command above does not
# run it.
layer_screen:
  enabled: true
  method: work_bend
  budget_frac: 0.25
  min_budget: 2

sae:
  enabled: false  # run_layer_screen_bakeoff.py trains its own per-layer SAEs directly

report:
  enabled: false

stats:
  enabled: true
  n_boot: 200
  n_boot_heavy: 100
  ci: 0.95
  alpha: 0.05
  min_series: 8

internals:
  enabled: true
  layer_stride: 1
  max_rows: 15000
  probe_pca_dim: 50

confirm:
  enabled: false
