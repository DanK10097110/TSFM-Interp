[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm-lens"
version = "0.1.0"
description = "Layered, architecture-agnostic interpretability comparison of time-series foundation models"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "scipy>=1.10",
  "scikit-learn>=1.3", "zarr>=2.16,<3", "PyYAML>=6.0", "jinja2>=3.1",
  "plotly>=5.18", "tqdm>=4.66",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]
chronos = ["chronos-forecasting>=1.2"]
# >=2.0, not the old [torch] extra a pre-2.0 install used: >=2.0 removed
# the TimesFmHparams/TimesFmCheckpoint class API entirely and switched to a
# new class-based API with no such extra (CLAUDE.md sec 11.8); verified
# working at timesfm==2.0.2, plain `pip install timesfm` (DEPENDENCIES.md).
timesfm = ["timesfm>=2.0"]
# TTM (ibm-granite/granite-timeseries-ttm-r1), ROADMAP.md sec 38.3 (K3). Exactly
# 0.2.28: 0.3.x downgrades torch and scikit-learn in the shared env (pip
# --dry-run, 2026-09-29). NOT YET USABLE: 0.2.28 installs cleanly but
# `import tsfm_public` fails under transformers 4.57.6 (see DEPENDENCIES.md),
# so no `ttm` adapter exists and this extra is a record, not a working path.
ttm = ["granite-tsfm==0.2.28"]

[project.scripts]
tsfm-lens = "tsfm_lens.run:main"

[tool.setuptools.packages.find]
include = ["tsfm_lens*"]
