# ============================================================================
# Full-multidomain, tractably-scaled first real run
# ============================================================================
# A ratio-preserving ~10x scale-down of configs/full_multidomain.yaml, sized
# from a live throughput calibration rather than guessed. Read
# full_multidomain.yaml's own header first -- this file changes only `count`
# on each task (proportionally) plus real_sequential_par's count, never the
# generators/tiers/source configs themselves, so every design decision
# documented there (n_domains unset, two real corpora, three real-derived
# generators) still applies here unchanged.
#
# Why this file exists instead of just running full_multidomain.yaml directly
# (ROADMAP.md §5.1, ~2026-08-03 follow-up session): a moderate calibration
# build (`--max-count 300` against full_multidomain.yaml, both splits) measured
# ~4.3 samples/sec end-to-end (generation + two-stage DTW leakage audit +
# cross-split near-duplicate detection) -- 4313 attempted samples in 16m33s.
# full_multidomain.yaml's literal counts sum to ~49,550 per split (~99,100
# attempted across both splits); at that measured rate that's roughly 6+ hours,
# impractical for an interactive session and not what "test with actual runs"
# was asking for here. This file instead targets ~5,000 attempted samples per
# split (~10,000 total), calibrated to complete in well under an hour, while
# still being ~150x larger than the earlier real_data_smoke.yaml build (66
# total sequences) -- large enough for benchmark_validation's diversity/
# redundancy numbers to mean something, per CLAUDE.md §5's warning that n=32
# is too small to draw conclusions from.
#
# `real_sequential_par`'s count is NOT scaled down by the same 10x factor as
# everything else: its per-call cost used to scale with raw real-series length
# (a bug, fixed this session -- see generators.py's sequential_par docstring
# and ROADMAP.md's corrected cost finding) and is now bounded to ~5-6s/fit
# regardless of which domain gets bootstrapped, so keeping its count higher
# than a strict 1/10 scale (50 -> 40, not 50 -> 5) costs only ~3-4 extra
# minutes total and gives more real_derived population from that generator.
#
# The full, literal full_multidomain.yaml config remains the actual target
# scale for this benchmark tier -- this file is a deliberately smaller,
# tractable first real (non-smoke) run, not a replacement. A true full-scale
# build is future work best run unattended/overnight (see ROADMAP.md).
#
#   PYTHONPATH=. python3 tsfm_benchmark/example_runs/run_full.py \
#       --config configs/full_multidomain_run1.yaml \
#       --out ./benchmark_run1 --references monash --reference-limit 150
# ============================================================================

tasks:
  - name: diverse_synthetic_backbone
    generator: random_parametric
    count: 3500
    tier: synthetic
    generator_params:
      length: 512
      archetypes: [trend_dominant, seasonal_dominant, multi_seasonal_complex,
                   regime_switching, ar_colored_noise, anomaly_heavy,
                   clean_low_noise, noisy_chaotic, random_walk_drift,
                   intermittent_bursts, amplitude_modulated,
                   nonsinusoidal_seasonal]
    corruption_pool:
      - {op: jitter, sigma: [0.01, 0.08]}
      - {op: scaling, sigma: [0.05, 0.2]}
      - {op: time_warp, strength: [0.05, 0.25], n_knots: [3, 6]}
      - {op: dropout, rate: [0.02, 0.1]}
    n_corruptions: [0, 3]

  - name: real_bootstrapped_weighted_sum
    generator: mixture
    count: 650
    tier: realism_stress
    generator_params: {mode: weighted_sum, weight_concentration: 0.7}
    source_sample_size: [3, 10]
    source_config: {kind: monash, limit: 600, seed: 1}

  - name: real_bootstrapped_multiplicative
    generator: mixture
    count: 650
    tier: realism_stress
    generator_params: {mode: multiplicative, weight_concentration: 0.5}
    source_sample_size: [2, 6]
    source_config: {kind: monash, limit: 600, seed: 2}

  - name: real_ett_mixture
    generator: mixture
    count: 100
    tier: realism_stress
    generator_params: {mode: weighted_sum, weight_concentration: 0.8}
    source_sample_size: [2, 4]
    source_config: {kind: huggingface, dataset: ETDataset/ett, limit: 200, seed: 3}

  - name: real_block_bootstrap
    generator: block_bootstrap
    count: 50
    tier: realism_stress
    generator_params: {block_length: 24}
    source_sample_size: [1, 1]
    source_config: {kind: monash, limit: 600, seed: 4}

  - name: real_sequential_par
    generator: sequential_par
    count: 40
    tier: realism_stress
    generator_params: {epochs: 64, max_train_length: 512}
    source_sample_size: [4, 8]
    source_config: {kind: monash, limit: 600, seed: 5}
