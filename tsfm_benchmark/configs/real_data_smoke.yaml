# ============================================================================
# Real-data smoke config
# ============================================================================
# A fast, cheap config for verifying the real-derived path end to end (network
# access, all three real-derived generators, two real corpora) without paying
# full_multidomain.yaml's cost. Not for building an actual benchmark tier --
# use configs/full_multidomain.yaml for that. This exists because
# sequential_par is expensive per series (it fits a small RNN on every call --
# see generators.py's docstring): full_multidomain.yaml's epochs: 64 against
# real, several-hundred-point Monash series took long enough on CPU that a
# smoke test needs its own much cheaper epoch count and cohort size to stay a
# smoke test. Counts and epochs here are deliberately tiny; expect low-quality
# (possibly repetitive) sequential_par output at epochs: 5 -- that's expected
# for a wiring check, not a quality bar.
#
#   PYTHONPATH=. python3 tsfm_benchmark/example_runs/run_full.py \
#       --config configs/real_data_smoke.yaml --out ./smoke_out \
#       --references monash --reference-limit 20
# ============================================================================

tasks:
  - name: smoke_synthetic_backbone
    generator: random_parametric
    count: 10
    tier: synthetic
    generator_params: {length: 128}

  - name: smoke_real_mixture_monash
    generator: mixture
    count: 8
    tier: realism_stress
    generator_params: {mode: weighted_sum, weight_concentration: 0.7}
    source_sample_size: [2, 4]
    source_config: {kind: monash, n_domains: 4, limit: 40, seed: 1, domain_timeout_s: 20}

  - name: smoke_real_mixture_ett
    generator: mixture
    count: 5
    tier: realism_stress
    generator_params: {mode: weighted_sum, weight_concentration: 0.8}
    source_sample_size: [2, 3]
    source_config: {kind: huggingface, dataset: ETDataset/ett, limit: 20, seed: 2}

  - name: smoke_real_block_bootstrap
    generator: block_bootstrap
    count: 8
    tier: realism_stress
    generator_params: {block_length: 12}
    source_sample_size: [1, 1]
    source_config: {kind: monash, n_domains: 4, limit: 40, seed: 3, domain_timeout_s: 20}

  - name: smoke_real_sequential_par
    generator: sequential_par
    count: 4
    tier: realism_stress
    # Deliberately tiny: epochs: 5 (not the 64-128 a real build would use) and
    # a small source_sample_size, so this stays a wiring smoke test rather
    # than a many-minutes-per-series real run -- see the module docstring
    # above and generators.sequential_par's cost note.
    generator_params: {epochs: 5, length: 60}
    source_sample_size: [3, 4]
    source_config: {kind: monash, n_domains: 4, limit: 40, seed: 4, domain_timeout_s: 20}
