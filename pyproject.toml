[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm-benchmark"
version = "1.0.0"
description = "TSFM benchmark generation and validation pipeline"
readme = "tsfm_benchmark/README.md"
license = {text = "MIT"}
authors = [{name = "Daniel Kushnir"}]
keywords = ["interpretability", "mechanistic-interpretability", "time-series", "foundation-models", "transformers", "forecasting"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pyyaml",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Feature-space diversity (catch22), the UMAP plot and the interactive figures
# used by tsfm_benchmark.benchmark_validation (requirements.txt there).
validation = [
  "pycatch22>=0.4",
  "umap-learn>=0.5",
  "plotly>=5.0",
]
# Verified working 2026-08-03 in a dedicated conda-forge env (see
# tsfm_benchmark/README.md / CLAUDE.md §12 for the full story of why these
# exact bounds matter -- every one of them was discovered by a real breaking
# change, not chosen speculatively):
#   - datasets MUST be <3: Monash-University/monash_tsf (and most Monash-era
#     HF forecasting datasets) are script-backed, and datasets>=3 removed
#     script-based dataset loading entirely ("Dataset scripts are no longer
#     supported"). >=2.18 was the original (correct) floor; the missing upper
#     bound is what broke once a newer datasets got installed. 2.21.0 was
#     verified on the earlier tsfmPy env; the reference env (cudaPy) runs
#     2.19.2 (DEPENDENCIES.md sec 3).
#   - tsbootstrap's public API was fully rewritten between versions (the
#     class-based MovingBlockBootstrap(...).bootstrap(...) this was
#     originally written against no longer exists as of 0.7.1, replaced by a
#     functional bootstrap(X, method=MovingBlock(...), ...) call). No version
#     ceiling is pinned here because the call site in generators.py now
#     targets the current (0.7.1+) API directly -- if you need the old API,
#     you need the old package, not this code.
#   - sdv verified working at 1.14.0 (conda-forge, python 3.12, numpy 2.1.0).
#   - On Windows with MKL-linked BLAS: conda-forge's numpy 2.1.0 build predates
#     mkl 2025+ and crashes on basic matmuls (illegal instruction) against a
#     newer MKL runtime pulled in transitively (e.g. by sdv's pytorch
#     dependency) -- pin mkl==2024.2.2 alongside these if you hit that.
real-data = [
  "datasets>=2.18,<3",   # Hugging Face hub access (Monash and other real corpora); see note above
  "dtaidistance>=2.3",   # fast C DTW for the leakage gate; numpy fallback exists
  "tsbootstrap>=0.7",    # block bootstrap generator; generators.py targets the 0.7+ functional API
  "sdv>=1.9",            # PARSynthesizer for the sequential generator
]

[project.urls]
Homepage = "https://github.com/DanK10097110/TSFM-Interp"
Repository = "https://github.com/DanK10097110/TSFM-Interp"
Documentation = "https://dank10097110.github.io/TSFM-Interp/"
Changelog = "https://github.com/DanK10097110/TSFM-Interp/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = [
  "tsfm_benchmark",
  "tsfm_benchmark.build_pipeline",
  "tsfm_benchmark.benchmark_validation",
  "tsfm_benchmark.example_runs",
]
