[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm-benchmark"
version = "0.1.0"
description = "TSFM benchmark generation and validation pipeline"
readme = "tsfm_benchmark/README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pyyaml",
]

[project.optional-dependencies]
real-data = [
  "datasets>=2.18",      # Hugging Face hub access (Monash and other real corpora)
  "dtaidistance>=2.3",   # fast C DTW for the leakage gate; numpy fallback exists
  "tsbootstrap>=0.1",    # block bootstrap generator
  "sdv>=1.9",            # PARSynthesizer for the sequential generator
]

[tool.setuptools]
packages = [
  "tsfm_benchmark",
  "tsfm_benchmark.build_pipeline",
  "tsfm_benchmark.benchmark_validation",
  "tsfm_benchmark.example_runs",
]
