# Paired level-shift sensitivity check. Same contexts and search settings as all_types, except rank.
run: {name: steering_level_rank64, device: cpu, dtype: float32, seed: 731}
data: {source: smoke, context_len: 64, horizon: 8, smoke_series_per_family: 24}
models:
  - {name: Chronos-Bolt, adapter: chronos_bolt, checkpoint: amazon/chronos-bolt-small, batch_size: 128}
  - {name: TimesFM, adapter: timesfm, checkpoint: google/timesfm-2.5-200m-pytorch, batch_size: 128}
steering:
  enabled: true
  max_series: 24
  quantiles: [0.1, 0.5, 0.9]
  search: {max_candidates: 3, screen_candidates: 8, rank: 64, refinement_steps: 1, calibration_samples: 4, validation_samples: 4}
  requests:
    - {kind: level, strength: 0.2}
